    return '<div class="cat t-'+g.key+'" data-k="'+g.key+'"><label><input type="checkbox" checked><span class="sw"></span>'+g.name+'<span class="n">'+n+'</span></label>'
      + '<button class="solo" type="button" data-solo="'+g.key+'" aria-label="只看'+g.name+'">只看</button></div>';
  }).join('');
  if(SUBS.length > 1){
    $('#subs').hidden = false;
    $('#subs').innerHTML = '<legend class="sr">住宿類型（可複選）</legend><span class="subtitle">住宿類型</span>' + SUBS.map(s => {
      const n = PLACES.filter(p => p.sub === s).length;
      return '<div class="cat" data-s="'+esc(s)+'"><label><input type="checkbox" checked><span class="sw"></span>'+esc(s)+'<span class="n">'+n+'</span></label></div>';
    }).join('');
  }
  const regions = [];
  PLACES.forEach(p => { if(!regions.some(r => r.zh === p.region)) regions.push({zh:p.region, en:p.regionEn}); });
  $('#region').innerHTML = '<option value="">全部地區</option>' + regions.map(r => '<option value="'+esc(r.zh)+'">'+esc(r.zh)+(r.en ? ' '+esc(r.en) : '')+'</option>').join('');
}
function syncChecks(){
  document.querySelectorAll('#cats .cat').forEach(el => {
    const on = sel.has(el.dataset.k);
    el.querySelector('input').checked = on;
    el.classList.toggle('off', !on);
  });
  document.querySelectorAll('#subs .cat').forEach(el => {
    const on = subSel.has(el.dataset.s);
    el.querySelector('input').checked = on;
    el.classList.toggle('off', !on);
  });
}
function updateCount(){
  const n = PLACES.filter(matches).length;
  $('#count').textContent = '顯示 '+n+' / '+PLACES.length+' 個地點';
  $('#tbDone').textContent = '看地圖（'+n+' 個地點）';
  $('#dkFilter').textContent = '篩選・搜尋' + (n < PLACES.length ? '（'+n+'）' : '');
}
function refresh(){ syncChecks(); $('#subs').hidden = !(SUBS.length > 1 && sel.has('hotel')); if(pinned && !matches(byId[pinned])) pinned = null; renderPins(); update(); updateCount(); }

$('#cats').addEventListener('change', e => {
  const el = e.target.closest('.cat'); if(!el) return;
  e.target.checked ? sel.add(el.dataset.k) : sel.delete(el.dataset.k);
  refresh();
  const list = PLACES.filter(matches);
  if(list.length){ fitToPlaces(list); centerMapInView(); } else { flyTo(700, CY, fitW()); }
});
$('#subs').addEventListener('change', e => {
  const el = e.target.closest('.cat'); if(!el) return;
  e.target.checked ? subSel.add(el.dataset.s) : subSel.delete(el.dataset.s);
  refresh();
  const list = PLACES.filter(matches);
  if(list.length){ fitToPlaces(list); centerMapInView(); }
});
$('#cats').addEventListener('click', e => {
  const b = e.target.closest('[data-solo]'); if(!b) return;
  sel.clear(); sel.add(b.dataset.solo); refresh();
  fitToPlaces(PLACES.filter(matches)); centerMapInView();
});
$('#allBtn').addEventListener('click', () => { GROUPS.forEach(g => sel.add(g.key)); SUBS.forEach(s => subSel.add(s)); refresh(); });
$('#noneBtn').addEventListener('click', () => { sel.clear(); refresh(); });
let qTimer = 0;
$('#q').addEventListener('input', e => {
  clearTimeout(qTimer);
  qTimer = setTimeout(() => {
    query = e.target.value.trim().toLowerCase(); refresh();
    if(query){ fitToPlaces(PLACES.filter(matches)); centerMapInView(); }
  }, 180);
});
$('#region').addEventListener('change', e => {
  regionSel = e.target.value; refresh();
  if(regionSel) fitToPlaces(PLACES.filter(matches)); else flyTo(700, CY, fitW());
  centerMapInView();
});

/* ===== 圖示與聚合 ===== */
function bodyShape(t){
  if(t === 'hotel') return '<rect class="badge" x="-24" y="-60" width="48" height="48" rx="15"/>';
  if(t === 'shop') return '<rect class="badge" x="-24" y="-60" width="48" height="48" rx="8"/>';
  if(t === 'club') return '<polygon class="badge" points="0,-67 29,-36 0,-5 -29,-36"/>';
  if(t === 'food') return '<polygon class="badge" points="0,-64 24,-50 24,-22 0,-8 -24,-22 -24,-50"/>';
  return '<circle class="badge" cy="-36" r="25"/>';
}
function pinSVG(p, i, S){
  return '<g class="pin t-'+p.type+(p.id === pinned ? ' is-pinned' : '')+'" data-id="'+p.id+'" tabindex="0" role="button" aria-label="'+esc(p.short)+'（'+esc(catName(p))+'，'+esc(p.region)+'）" transform="translate('+p.x+' '+p.y+') scale('+S.toFixed(3)+')">'
    + '<ellipse class="pin-shadow" rx="16" ry="5"/>'
    + '<g class="pin-body"><g class="pin-idle" style="--i:'+(i%7)+'">'
    + '<circle class="ring" cy="-36" r="36"/>'
    + '<path class="tail" d="M-9 -16 L0 0 L9 -16Z"/>'
    + bodyShape(p.type)
    + '<g transform="translate(0 -36)">'+(SYM[p.icon] || SYM.palm)+'</g>'
    + '</g></g>'
    + '<circle class="hit" cy="-34" r="28"/></g>';
}
let curClusters = [];
function renderPins(){
  const g = $('#pins'); if(!g) return;
  const m = metrics(), S = .92 * m.u * (isMob() ? 1.35 : 1), R = (isMob() ? 56 : 44) * m.f;
  const list = PLACES.filter(matches).sort((a, b) => a.y - b.y);
  const noCluster = editMode || view.w <= fitW() / 14;
  const groups = [];
  list.forEach(p => {
    if(noCluster || p.id === pinned){ groups.push({items:[p], cx:p.x, cy:p.y, fixed:true}); return; }
    const c = groups.find(q => !q.fixed && Math.hypot(q.cx-p.x, q.cy-p.y) * m.ppu < R);
    if(c){ c.items.push(p); c.cx = c.items.reduce((a, b) => a + b.x, 0) / c.items.length; c.cy = c.items.reduce((a, b) => a + b.y, 0) / c.items.length; }
    else groups.push({items:[p], cx:p.x, cy:p.y, fixed:false});
  });
  curClusters = groups.filter(c => c.items.length > 1);
  let html = '';
  groups.forEach((c, i) => {
    if(c.items.length === 1){ html += pinSVG(c.items[0], i, S); return; }
    const idx = curClusters.indexOf(c);
    const types = [...new Set(c.items.map(p => p.type))];
    const cls = types.length === 1 ? 't-'+types[0] : 't-mix';
    html += '<g class="cluster '+cls+'" data-c="'+idx+'" tabindex="0" role="button" aria-label="'+c.items.length+' 個地點，點一下放大" transform="translate('+f1(c.cx)+' '+f1(c.cy)+') scale('+S.toFixed(3)+')">'
      + '<ellipse class="pin-shadow" rx="18" ry="5"/><g class="cbody"><circle class="ring" cy="-30" r="32"/>'
      + '<circle class="badge" cy="-30" r="27" stroke-width="5"/><text class="ctext" y="-22">'+c.items.length+'</text></g></g>';
  });
  g.innerHTML = html;
}

/* ===== 資訊面板 ===== */
const iconSVG = p => '<svg viewBox="-16 -16 32 32" aria-hidden="true">'+(SYM[p.icon] || SYM.palm)+'</svg>';
function indexList(){
  const list = PLACES.filter(matches);
  if(!list.length) return '<p class="empty">沒有符合條件的地點。可以調整上方的類型、搜尋或地區。</p>';
  const regions = [];
  list.forEach(p => { if(!regions.includes(p.region)) regions.push(p.region); });
  return regions.map(r => {
    const g = list.filter(p => p.region === r);
    return '<h3>'+esc(r)+'（'+g.length+'）</h3><ul class="index">'
      + g.map(p => '<li><button class="row t-'+p.type+'" type="button" data-goto="'+p.id+'"><span class="dot"></span><span class="nm">'+esc(p.short)+'</span><small>'+esc(catName(p))+'</small></button></li>').join('')
      + '</ul>';
  }).join('');
}
function renderPanel(p){
  const el = $('#panel');
  if(!p){
    el.innerHTML = (isMob() ? '<button class="p-close" type="button" data-close aria-label="關閉清單">✕</button><h2>地點清單</h2><p class="hint">點一下地點，地圖會移過去並顯示介紹。</p>' : '<h2>歡迎來到峇里島</h2><p class="hint">把滑鼠移到圖示上，這裡會顯示介紹。點一下可以固定，也可以從下面的清單挑地點，地圖會移過去。</p>') + indexList();
    return;
  }
  const closeBtn = '<button class="p-close" type="button" data-close aria-label="關閉介紹視窗">✕</button>';
  const info = [['門票',p.ticket],['美元標價',p.usd],['盧布標價',p.idr],['台幣標價',p.twd],['Klook',p.klook],['KKday',p.kkday]].filter(r => r[1]);
  const rows = (p.sub ? [['類型',p.sub]] : []).concat(p.place ? [['地點',p.place]] : []).concat(info).map(r => '<dt>'+r[0]+'</dt><dd>'+esc(r[1])+'</dd>').join('');
  const same = PLACES.filter(q => q.region === p.region && q.id !== p.id && matches(q))
    .sort((a, b) => Math.hypot(a.x-p.x, a.y-p.y) - Math.hypot(b.x-p.x, b.y-p.y));
  const near = same.slice(0, 8).map(n => '<button class="btn" type="button" data-goto="'+n.id+'">'+esc(n.short)+'</button>').join('')
    + (same.length > 8 ? '<span class="hint">還有 '+(same.length-8)+' 個，可從地圖或搜尋找</span>' : '');
  const url = safeUrl(p.url);
  const isMap = /maps\.app\.goo\.gl|google\.[a-z.]+\/maps/i.test(url);
  el.innerHTML = closeBtn + '<div class="p-head t-'+p.type+'"><span class="p-icon t-'+p.type+'">'+iconSVG(p)+'</span><div><span class="tag t-'+p.type+'">'+esc(catName(p))+'・'+esc(p.region)+(p.regionEn ? ' '+esc(p.regionEn) : '')+'</span>'+(ZDEF[p.zone] ? '<span class="ztag" style="--zc:'+ZDEF[p.zone].c+'">'+ZDEF[p.zone].name+'</span>' : '')+'<h2>'+esc(p.name)+'</h2></div></div>'
    + (p.desc ? '<p class="longtext">'+esc(p.desc)+'</p>' : '<p class="empty">尚未填寫介紹。</p>')
    + (rows ? '<dl class="rows">'+rows+'</dl>' : '')
    + (p.review ? '<div class="review"><h3>小編銳評</h3><p class="longtext" style="margin:0">'+esc(p.review)+'</p></div>' : '')
    + (p.rules ? '<h3>特別規定</h3><p class="longtext" style="margin-top:0">'+esc(p.rules)+'</p>' : '')
    + (near ? '<h3>同地區的其他地點</h3><div class="near">'+near+'</div>' : '')
    + (url ? '<a class="go" href="'+esc(url)+'" target="_blank" rel="noopener noreferrer">'+(isMap ? '在地圖開啟' : '前往網站')+' ↗</a>' : '')
    + (safeUrl(p.ig) && safeUrl(p.ig) !== url ? '<a class="go alt2" href="'+esc(safeUrl(p.ig))+'" target="_blank" rel="noopener noreferrer">Instagram ↗</a>' : '')
    + (p.map && !isMap ? '<a class="go'+(url ? ' alt' : '')+'" href="'+esc(p.map)+'" target="_blank" rel="noopener noreferrer">Google 地圖 ↗</a>' : '')
    + (pinned === p.id ? '<div class="pinned-note"><span>已固定在這裡</span><button type="button" data-unpin>取消固定</button></div>' : '');
}
function renderTip(p){
  const g = $('#tipLayer');
  if(!p){ g.innerHTML = ''; return; }
  const S = .92 * metrics().u * (isMob() ? 1.35 : 1);
  const topY = view.cy - viewH(view.w)/2;
  const below = p.y - 80*S < topY + 30*S;
  g.innerHTML = '<text class="tip" x="'+p.x+'" y="'+f1(below ? p.y + 32*S : p.y - 72*S)+'">'+esc(p.short)+'</text>';
}
let lastShown = '';
function update(){
  const cur = byId[hover] || byId[pinned] || null;
  const key = (cur ? cur.id : '') + '|' + (pinned || '') + '|' + (cur ? '' : [...sel].join()+[...subSel].join()+query+regionSel);
  if(key !== lastShown || !cur){ renderPanel(cur); lastShown = key; }
  renderTip(cur);
  document.querySelectorAll('.pin').forEach(el => el.classList.toggle('is-pinned', el.dataset.id === pinned));
  document.body.classList.toggle('sheet-panel', isMob() && (!!pinned || listOpen));
}
function isMob(){ return matchMedia('(max-width:999px)').matches; }
/* 手機：把選到的點放在畫面上半部，避免被下方面板蓋住 */
function flyToPin(p, w){
  if(isMob()){ const h = viewH(w); flyTo(p.x, p.y + h*0.27, w); } else flyTo(p.x, p.y - 30, w);
}
function centerMapInView(){
  const r = $('#mapbox').getBoundingClientRect(), c = r.top + r.height/2;
  if(c > innerHeight*0.7 || c < innerHeight*0.3) window.scrollBy({top: c - innerHeight/2, behavior: reduceMotion() ? 'auto' : 'smooth'});
}
function focusPanel(){}
function selectPlace(id, fly){
  pinned = id; hover = null; listOpen = false;
  renderPins(); update();
  const p = byId[id];
  if(fly && p) flyToPin(p, Math.min(view.w, fitW() / 2.8));
  focusPanel();
  if(!matchMedia('(max-width:999px)').matches) centerMapInView();
}

/* ===== 地圖上的互動（事件委派） ===== */
svg.addEventListener('pointerover', e => {
  if(e.pointerType === 'touch') return;
  const el = e.target.closest('.pin');
  if(el && el.dataset.id !== hover){ hover = el.dataset.id; update(); }
});
svg.addEventListener('pointerout', e => {
  const el = e.target.closest('.pin');
  if(el && !el.contains(e.relatedTarget)){ hover = null; update(); }
});
svg.addEventListener('focusin', e => { const el = e.target.closest('.pin'); if(el){ hover = el.dataset.id; update(); } });
svg.addEventListener('focusout', e => { if(e.target.closest('.pin')){ hover = null; update(); } });
svg.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.closest('.pin, .cluster')){
    e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', {bubbles:true}));
  }
});
svg.addEventListener('click', e => {
  if(dragMoved){ dragMoved = false; return; }
  if($('#mapbox').classList.contains('placing')){
    const r = svg.getBoundingClientRect(), h = viewH(view.w);
    const x = Math.round(view.cx - view.w/2 + (e.clientX - r.left) / r.width * view.w);
    const y = Math.round(view.cy - h/2 + (e.clientY - r.top) / r.height * h);
    $('#coordval').value = 'x: '+x+', y: '+y;
    const u = metrics().u;
    $('#fx').innerHTML = '<g transform="translate('+x+' '+y+') scale('+u.toFixed(3)+')"><circle r="9" fill="#fff" stroke="var(--act)" stroke-width="3"/><path d="M-15 0H15M0 -15V15" stroke="var(--act)" stroke-width="3" stroke-linecap="round"/></g>';
    return;
  }
  const c = e.target.closest('.cluster');
  if(c){
    const g = curClusters[+c.dataset.c];
    if(g){
      const xs = g.items.map(p => p.x), ys = g.items.map(p => p.y);
      const bw = Math.max(...xs) - Math.min(...xs), bh = Math.max(...ys) - Math.min(...ys);
      const w = Math.max(Math.min(view.w * 0.45, fitW()), (bw*2.4), bh*2.4*box.w/box.h, fitW()/MAXZ);
      flyTo(g.cx, g.cy - 30, Math.min(w, view.w * 0.7));
    }
    return;
  }
  const el = e.target.closest('.pin');
  if(el){
    const id = el.dataset.id;
    pinned = pinned === id ? null : id; hover = null; listOpen = false;
    renderPins(); update();
    if(pinned && isMob()) flyToPin(byId[id], view.w);
    return;
  }
  if(isMob()) closeSheets();
});

const panel = $('#panel');
panel.addEventListener('click', e => {
  const g = e.target.closest('[data-goto]');
  if(g){ selectPlace(g.dataset.goto, true); return; }
  if(e.target.closest('[data-unpin]')){ pinned = null; renderPins(); update(); }
  if(e.target.closest('[data-close]')) closePanel();
});
function closePanel(){ pinned = null; hover = null; listOpen = false; renderPins(); update(); }
function closeSheets(){ document.body.classList.remove('sheet-filter'); closePanel(); }
$('#dkFilter').addEventListener('click', () => { document.body.classList.add('sheet-filter'); });
$('#tbClose').addEventListener('click', () => document.body.classList.remove('sheet-filter'));
$('#tbDone').addEventListener('click', () => document.body.classList.remove('sheet-filter'));
$('#dkList').addEventListener('click', () => { pinned = null; listOpen = true; renderPins(); update(); });
$('#dkFit').addEventListener('click', () => flyTo(700, CY, fitW()));
/* 手機時，分區圖例放進篩選面板 */
(function(){
  const place = () => {
    const lg = $('#zlegend'); if(!lg) return;
    if(isMob()){ $('#toolbar').insertBefore(lg, $('#tbDone')); lg.classList.add('open'); }
    else { $('#mapbox').appendChild(lg); lg.classList.toggle('open', matchMedia('(min-width:1000px)').matches); }
  };
  matchMedia('(max-width:999px)').addEventListener('change', () => { place(); update(); });
  window.__placeLegend = place;
})();
document.addEventListener('keydown', e => { if(e.key === 'Escape' && (pinned || hover) && !editMode) closePanel(); });
const hot = (e, on) => {
  const g = e.target.closest('[data-goto]');
  if(!g) return;
  const pin = document.querySelector('.pin[data-id="'+g.dataset.goto+'"]');
  if(pin) pin.classList.toggle('is-hot', on);
};
panel.addEventListener('mouseover', e => hot(e, true));
panel.addEventListener('mouseout', e => hot(e, false));

/* ===== 取得座標、調整位置 ===== */
function updateEditBar(){
  const n = PLACES.filter(p => p.moved).length;
  $('#editMsg').textContent = n ? '已調整 '+n+' 個地點。調整好後按「複製位置」，貼給 Claude 就能寫進地圖。' : '拖曳圖示到正確的位置。縮放到最大可以調得更細。';
}
function setMode(mode){
  const placing = mode === 'place', editing = mode === 'edit';
  $('#placeBtn').setAttribute('aria-pressed', String(placing));
  $('#editBtn').setAttribute('aria-pressed', String(editing));
  $('#mapbox').classList.toggle('placing', placing);
  $('#mapbox').classList.toggle('editing', editing);
  $('#coordbar').hidden = !placing;
  $('#editbar').hidden = !editing;
  if(!placing) $('#fx').innerHTML = '';
  editMode = editing;
  updateEditBar();
  renderPins(); update();
}
$('#placeBtn').addEventListener('click', () => setMode($('#placeBtn').getAttribute('aria-pressed') === 'true' ? '' : 'place'));
(function(){
  const box = $('#mapbox');
  box.insertAdjacentHTML('beforeend', '<div class="zlegend'+(matchMedia('(min-width:1000px)').matches ? ' open' : '')+'" id="zlegend" role="group" aria-label="車程分區"><button class="zhead" type="button" id="zhead" aria-expanded="'+matchMedia('(min-width:1000px)').matches+'">車程分區</button>'
    + Object.keys(ZDEF).map(k => '<button class="zlb" type="button" data-z="'+k+'" aria-pressed="true" style="--zc:'+ZDEF[k].d+'"><i></i><span>'+ZDEF[k].name+' <small>'+ZDEF[k].note+'</small></span></button>').join('') + '</div>');
  window.__placeLegend();
  $('#zlegend').addEventListener('click', e => {
    if(e.target.closest('#zhead')){ const o = $('#zlegend').classList.toggle('open'); $('#zhead').setAttribute('aria-expanded', String(o)); return; }
    const bt = e.target.closest('.zlb'); if(!bt) return;
    const k = bt.dataset.z;
    if(zoneOff.has(k)) zoneOff.delete(k); else zoneOff.add(k);
    bt.setAttribute('aria-pressed', String(!zoneOff.has(k)));
    document.querySelectorAll('#zonesFill .zf[data-z="'+k+'"], #zflags .zf[data-z="'+k+'"]').forEach(n => n.classList.toggle('off', zoneOff.has(k)));
    refresh();
  });
  $('#allBtn').addEventListener('click', () => { zoneOff.clear(); document.querySelectorAll('.zlb').forEach(n => n.setAttribute('aria-pressed','true')); document.querySelectorAll('#zonesFill .zf, #zflags .zf').forEach(n => n.classList.remove('off')); });
})();
$('#zoneBtn').setAttribute('aria-pressed', 'false'); $('#zoneBtn').textContent = '熱門區域 關'; $('#map').classList.add('no-zones');
$('#zoneBtn').addEventListener('click', () => {
  const on = $('#zoneBtn').getAttribute('aria-pressed') !== 'true';
  $('#zoneBtn').setAttribute('aria-pressed', String(on)); $('#zoneBtn').textContent = '熱門區域 ' + (on ? '開' : '關');
  $('#map').classList.toggle('no-zones', !on);
});
$('#editBtn').addEventListener('click', () => setMode(editMode ? '' : 'edit'));
$('#resetPos').addEventListener('click', () => {
  PLACES.forEach(p => { p.x = p.ox; p.y = p.oy; p.moved = false; });
  savePositions(); updateEditBar(); renderPins(); update();
});
$('#copyPos').addEventListener('click', () => {
  const list = PLACES.filter(p => p.moved);
  const text = list.length
    ? '名稱 | 地區 | 畫布座標\n' + list.map(p => p.name+' | '+p.region+(p.regionEn ? ' '+p.regionEn : '')+' | x: '+p.x+', y: '+p.y).join('\n')
    : '還沒有調整任何地點';
  const b = $('#copyPos');
  const done = () => { b.textContent = '已複製'; setTimeout(() => { b.textContent = '複製位置'; }, 1500); };
  const showText = () => { $('#editMsg').textContent = text; };
  try{ navigator.clipboard.writeText(text).then(done, showText); }catch(err){ showText(); }
});
$('#copyBtn').addEventListener('click', () => {
  const v = $('#coordval');
  const done = () => { $('#copyBtn').textContent = '已複製'; setTimeout(() => { $('#copyBtn').textContent = '複製'; }, 1500); };
  const fallback = () => { v.focus(); v.select(); };
  try{ navigator.clipboard.writeText(v.value).then(done, fallback); }catch(err){ fallback(); }
});

/* ===== 啟動 ===== */
if(matchMedia('(pointer:coarse)').matches) $('#hint').textContent = '雙指縮放・拖曳移動';
buildMap();
buildFilters();
measure();
updateCount();
if('ResizeObserver' in window) new ResizeObserver(() => measure()).observe(svg);
else addEventListener('resize', measure);
</script>
