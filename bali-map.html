<title>峇里島地圖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap">
<style>
/* 版面：頂部篩選列，下方是可縮放拖曳的整張插畫地圖；資訊面板浮在左下角海面，窄螢幕時接在地圖下方 */
:root{
  --bg:#EEF7F3; --surface:#FFFFFF; --ink:#2C4A41; --muted:#5F7B70; --line:#D3E6DC; --frame:#FFFFFF;
  --sea:#BFE8EC; --shallow:#D7F2F1; --wave:#FFFFFF; --sand:#F8E9B8; --grass:#B7E28F; --lake:#8CD2EA; --terr:#8FC96A;
  --crown:#63B66E; --crown2:#4FA662; --trunk:#A9805A; --cloud:rgba(255,255,255,.8);
  --spot:#3B9EF0; --hotel:#E9A91C; --food:#F0607A; --act:#FF8C42; --club:#A66CE8; --shop:#2E8B57; --spa:#D9699F; --other:#2FBFA5;
  --halo:#FFFFFF; --btn:#2C4A41; --btn-fg:#FFFFFF; --focus:#5B7CFF;
  --font:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1D1B; --surface:#182A27; --ink:#E4F2EB; --muted:#94B1A5; --line:#2B4640; --frame:#2B4640;
    --sea:#1D4A57; --shallow:#25606B; --wave:#9ADBE4; --sand:#8F8156; --grass:#4F8247; --lake:#2F7185; --terr:#6BA35A;
    --crown:#33704A; --crown2:#2A5E3F; --trunk:#7C5E42; --cloud:rgba(255,255,255,.2);
    --spot:#6BB8F5; --hotel:#F2BC55; --food:#F68CA0; --act:#FF9F6B; --club:#BE90F0; --shop:#5DBB88; --spa:#EC8FBB; --other:#4FD1B5;
    --halo:#12302B; --btn:#E4F2EB; --btn-fg:#0F1D1B; --focus:#9AB3FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1D1B; --surface:#182A27; --ink:#E4F2EB; --muted:#94B1A5; --line:#2B4640; --frame:#2B4640;
  --sea:#1D4A57; --shallow:#25606B; --wave:#9ADBE4; --sand:#8F8156; --grass:#4F8247; --lake:#2F7185; --terr:#6BA35A;
  --crown:#33704A; --crown2:#2A5E3F; --trunk:#7C5E42; --cloud:rgba(255,255,255,.2);
  --spot:#6BB8F5; --hotel:#F2BC55; --food:#F68CA0; --act:#FF9F6B; --club:#BE90F0; --shop:#5DBB88; --spa:#EC8FBB; --other:#4FD1B5;
  --halo:#12302B; --btn:#E4F2EB; --btn-fg:#0F1D1B; --focus:#9AB3FF;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.7;
  padding-inline:max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block:20px 40px;
}
.wrap{max-width:1800px; margin:0 auto; display:grid; gap:14px}
h1{font-size:clamp(24px,3.4vw,32px); line-height:1.25; margin:0; font-weight:400; text-wrap:balance}
.sub{margin:4px 0 0; color:var(--muted); max-width:60ch; font-size:14px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* 篩選列 */
.toolbar{display:grid; gap:10px}
.cats{display:flex; flex-wrap:wrap; gap:8px; border:0; margin:0; padding:0; min-width:0}
.cat{display:inline-flex; align-items:center; border:2px solid var(--line); border-radius:999px; background:var(--surface); position:relative; transition:opacity .15s}
.cat.off{opacity:.62}
.cat label{display:flex; align-items:center; gap:8px; padding:5px 6px 5px 12px; min-height:40px; cursor:pointer}
.cat input{position:absolute; opacity:0; width:1px; height:1px}
.sw{width:20px; height:20px; border-radius:7px; border:2px solid var(--pin); background:transparent; display:grid; place-items:center; flex:none}
.cat input:checked + .sw{background:var(--pin)}
.cat input:checked + .sw::after{content:""; width:5px; height:9px; border:solid #fff; border-width:0 2.5px 2.5px 0; transform:translateY(-1px) rotate(45deg)}
.cat input:focus-visible + .sw{outline:3px solid var(--focus); outline-offset:2px}
.cat .n{color:var(--muted); font-size:13px}
.solo{font:inherit; font-size:12px; color:var(--muted); background:none; border:0; border-radius:999px; padding:2px 10px 2px 6px; margin-right:4px; min-height:30px; cursor:pointer}
.solo:hover{background:var(--bg); color:var(--ink)}
.subs{align-items:center}
.subs .cat{--pin:var(--muted)}
.subs .cat label{min-height:34px; padding:3px 12px 3px 10px; font-size:14px}
.subs .sw{width:18px; height:18px; border-radius:6px}
.subtitle{color:var(--muted); font-size:13px; margin-right:2px}
.row2{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center}
.field{
  font:inherit; color:var(--ink); background:var(--surface); border:2px solid var(--line); border-radius:999px;
  min-height:40px; padding:4px 16px; min-width:0;
}
#q{width:min(260px,100%)}
.btn{
  font:inherit; color:var(--ink); background:var(--surface); border:2px solid var(--line);
  min-height:40px; padding:4px 16px; border-radius:999px; cursor:pointer; transition:transform .15s;
}
.btn:hover{transform:translateY(-2px)}
.btn[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.btn.tool{border-style:dashed}
.count{color:var(--muted); font-size:14px; margin-left:auto}
.field:focus-visible, .btn:focus-visible, .go:focus-visible, .row:focus-visible, .mini:focus-visible, .solo:focus-visible, .zbtn:focus-visible{outline:3px solid var(--focus); outline-offset:2px}

/* 地圖 */
.mapbox{position:relative; border-radius:28px; border:5px solid var(--frame); background:var(--sea); overflow:hidden; min-width:0}
#map{display:block; width:100%; height:auto; aspect-ratio:1400/900; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none}
#map.dragging{cursor:grabbing}
.mapbox.placing #map{cursor:crosshair}
.mapbox.placing .pin, .mapbox.placing .cluster{pointer-events:none}
.mapbox.editing .pin{cursor:grab}
.mapbox.editing .pin:active{cursor:grabbing}
@media (max-width:699px){ #map{aspect-ratio:4/3} }
.zoom{position:absolute; top:12px; right:12px; display:grid; gap:6px; z-index:2}
.zbtn{
  width:42px; height:42px; border-radius:14px; border:2px solid var(--line); background:var(--surface); color:var(--ink);
  font:inherit; font-size:22px; line-height:1; cursor:pointer; display:grid; place-items:center; box-shadow:0 4px 12px rgba(20,60,50,.15);
}
.zbtn:hover{transform:translateY(-1px)}
.zbtn.fit{font-size:15px}
.maphint{
  position:absolute; left:12px; top:12px; font-size:12px; color:var(--ink); background:color-mix(in srgb, var(--surface) 82%, transparent);
  padding:2px 10px; border-radius:999px; pointer-events:none; z-index:2
}
.coordbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:10px 14px;
  background:var(--surface); border-top:2px solid var(--line); font-size:14px;
}
.coordbar[hidden]{display:none}
.coordbar input{font:inherit; color:var(--ink); background:var(--bg); border:2px solid var(--line); border-radius:12px; padding:4px 10px; width:12.5em; min-width:0}
.mini{font:inherit; color:var(--btn-fg); background:var(--btn); border:0; border-radius:999px; padding:4px 14px; min-height:34px; cursor:pointer}


/* ===== 手機：全螢幕地圖＋底部操作列＋下滑面板 ===== */
.sheet-head, .done, #dock{display:none}
@media (max-width:999px){
  html, body{height:100%; overflow:hidden; overscroll-behavior:none}
  body{padding:0}
  .wrap{display:block; max-width:none}
  header{position:fixed; top:calc(8px + env(safe-area-inset-top, 0px)); left:10px; z-index:5; padding:0 16px; border-radius:999px; pointer-events:none;
    background:color-mix(in srgb, var(--surface) 90%, transparent); border:2px solid var(--line)}
  header h1{font-size:17px; line-height:1.9} header .sub{display:none}
  .mapbox{position:fixed; inset:0; border:0; border-radius:0}
  #map{width:100%; height:100%; aspect-ratio:auto}
  .zoom{top:calc(8px + env(safe-area-inset-top, 0px))}
  .zbtn{width:46px; height:46px}
  .maphint{top:calc(56px + env(safe-area-inset-top, 0px))}
  #placeBtn, #editBtn, #zoneBtn{display:none}

  #dock{display:flex; position:fixed; left:50%; transform:translateX(-50%); bottom:calc(14px + env(safe-area-inset-bottom, 0px)); z-index:20; gap:6px; padding:6px;
    background:color-mix(in srgb, var(--surface) 94%, transparent); border:2px solid var(--line); border-radius:999px; box-shadow:0 8px 24px rgba(20,60,50,.3)}
  #dock button{font:inherit; min-height:48px; padding:0 20px; border-radius:999px; border:0; background:none; color:var(--ink); cursor:pointer; white-space:nowrap}
  #dock button.main{background:var(--ink); color:var(--bg)}
  body.sheet-filter #dock, body.sheet-panel #dock{display:none}

  .toolbar{position:fixed; left:0; right:0; bottom:0; z-index:30; max-height:84dvh; overflow-y:auto; display:block; background:var(--surface); border-top:2px solid var(--line);
    border-radius:26px 26px 0 0; padding:0 16px 14px; transform:translateY(110%); visibility:hidden; transition:transform .28s ease, visibility 0s .28s; box-shadow:0 -10px 30px rgba(0,0,0,.28)}
  .toolbar > * + *{margin-top:12px}
  body.sheet-filter .toolbar{transform:none; visibility:visible; transition:transform .28s ease}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:3; background:var(--surface); padding:14px 0 6px; margin:0 !important}
  .sheet-head strong{font-weight:400; font-size:19px}
  .sheet-head .p-close{position:static}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  #q{width:100%; grid-column:1 / -1} #region{grid-column:1 / -1}
  .count{grid-column:1 / -1; margin:0}
  .cat label{min-height:46px} .subs .cat label{min-height:42px}
  .done{display:block; position:sticky; bottom:0; width:100%; background:var(--ink); color:var(--bg); border-color:var(--ink); min-height:50px; box-shadow:0 -8px 12px var(--surface)}
  .toolbar .zlegend{position:static; max-width:none; border:0; padding:0; background:none; display:flex; flex-direction:row; flex-wrap:wrap; gap:8px}
  .toolbar .zhead{width:100%; pointer-events:none; padding:0; color:var(--muted); font-weight:400} .toolbar .zhead::after{content:none}
  .toolbar .zlb{display:flex !important} .toolbar .zlb small{display:inline}

  body #panel{position:fixed; left:0; right:0; bottom:0; z-index:25; max-height:58dvh; overflow-y:auto; border-width:2px 0 0 0; border-radius:26px 26px 0 0;
    padding-bottom:calc(22px + env(safe-area-inset-bottom, 0px)); transform:translateY(110%); visibility:hidden; transition:transform .28s ease, visibility 0s .28s; box-shadow:0 -10px 30px rgba(0,0,0,.28)}
  body.sheet-panel #panel{transform:none; visibility:visible; transition:transform .28s ease}
  .row{min-height:48px}
}

/* 車程分區 */
.zf{transition:opacity .2s}
.zf-fill{opacity:.9} .zf-dots{opacity:1; pointer-events:none} .zf.off{opacity:0}
.zflag{font-family:var(--font); font-weight:700; font-size:17px; pointer-events:none; transition:opacity .2s}
.zflag text{stroke:none}
.zf-line{fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round; stroke-dasharray:.1 11; opacity:.95}
.zlegend{position:absolute; right:12px; bottom:12px; z-index:3; display:flex; flex-direction:column; gap:6px; padding:8px; background:var(--surface); border:2px solid var(--line); border-radius:20px; max-width:230px}
.zhead{font:inherit; font-size:14px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:10px; min-height:36px; padding:0 8px; border:0; background:none; color:var(--ink); cursor:pointer}
.zhead::after{content:'▾'; transition:transform .2s} .zlegend.open .zhead::after{transform:rotate(180deg)}
.zlegend:not(.open) .zlb{display:none}
.zhead:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:12px}
.zlb{font:inherit; font-size:14px; display:flex; align-items:center; gap:8px; text-align:left; min-height:34px; padding:3px 10px; border-radius:999px; border:2px solid var(--line); background:var(--bg); color:var(--ink); cursor:pointer}
.zlb i{flex:none; width:14px; height:14px; border-radius:50%; background:var(--zc)}
.zlb small{color:var(--muted); font-size:12px}
.zlb[aria-pressed=false]{opacity:.45}
.zlb:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
@media (max-width:999px){.zlegend{top:56px; left:12px; right:auto; bottom:auto; max-width:200px} .zlb small{display:none}}
.ztag{display:inline-block; margin-left:6px; padding:1px 10px; border-radius:999px; background:var(--zc); color:#fff; font-size:12px}
.go.alt2{background:transparent; color:var(--ink); border:2px solid var(--ink); margin-left:8px}

/* 熱門區域色塊 */
.zone-fill{opacity:.2}
.zone-line{fill:none; stroke-width:calc(3px * var(--u, 1)); stroke-dasharray:calc(9px * var(--u, 1)) calc(7px * var(--u, 1)); opacity:.75}
.zone-name{font-family:var(--font); font-weight:700; font-size:calc(26px * var(--u, 1)); stroke:var(--halo); stroke-width:calc(7px * var(--u, 1)); paint-order:stroke; stroke-linejoin:round; pointer-events:none}
.zone-name .en{font-size:calc(14px * var(--u, 1)); font-weight:500; fill:var(--muted)}
#map.no-zones .zone-g{display:none}
.btn[aria-pressed=true]#zoneBtn{background:var(--btn); color:var(--btn-fg)}

/* 小島圖層 */
.c-grass{fill:var(--grass)}
.c-lake{fill:var(--lake); stroke:var(--sand); stroke-width:5}
.c-crown{fill:var(--crown)} .c-crown2{fill:var(--crown2)} .c-trunk{fill:var(--trunk)}
.c-cloud{fill:var(--cloud)}
.c-terr{fill:none; stroke:var(--terr); stroke-width:4; stroke-linecap:round}
.c-wave{fill:none; stroke:var(--wave); stroke-width:3; stroke-linecap:round}
.wave{animation:wave 4.2s ease-in-out infinite; animation-delay:calc(var(--i) * -.7s)}
@keyframes wave{0%,100%{opacity:.25; transform:translateX(0)} 50%{opacity:.8; transform:translateX(7px)}}
.cloud{animation:drift var(--dur) linear infinite; animation-delay:var(--del)}
@keyframes drift{from{transform:translateX(-260px)} to{transform:translateX(1700px)}}
.boat{animation:sail 7s ease-in-out infinite}
@keyframes sail{0%,100%{transform:translate(0,0) rotate(-2deg)} 50%{transform:translate(18px,-3px) rotate(2deg)}}
.region{font-family:var(--font); font-size:calc(21px * var(--u, 1)); fill:var(--ink); stroke:var(--halo); stroke-width:calc(6px * var(--u, 1)); paint-order:stroke; stroke-linejoin:round; pointer-events:none; opacity:.82}
.region .en{font-size:calc(13px * var(--u, 1)); fill:var(--muted)}

/* 圖示 */
.t-spot{--pin:var(--spot)} .t-hotel{--pin:var(--hotel)} .t-food{--pin:var(--food)}
.t-shop{--pin:var(--shop)} .t-spa{--pin:var(--spa)} .t-act{--pin:var(--act)} .t-club{--pin:var(--club)} .t-other{--pin:var(--other)} .t-mix{--pin:var(--btn)}
.cut{fill:var(--pin)} .cutl{fill:none; stroke:var(--pin)}
.pin, .cluster{cursor:pointer; outline:none}
.pin-shadow{fill:#000; opacity:.16}
.tail{fill:var(--pin); stroke:#fff; stroke-width:4; stroke-linejoin:round}
.badge{fill:var(--pin); stroke:#fff; stroke-width:4; stroke-linejoin:round}
.hit{fill:transparent}
.ring{fill:none; stroke:var(--pin); stroke-width:4; opacity:0; transform-box:fill-box; transform-origin:center}
.pin:focus-visible .ring, .cluster:focus-visible .ring{opacity:1}
.pin.is-pinned .ring{animation:pulse 1.8s ease-out infinite}
@keyframes pulse{0%{transform:scale(.9); opacity:.9} 100%{transform:scale(1.35); opacity:0}}
.ctext{font-family:var(--font); font-size:22px; fill:#fff; text-anchor:middle; pointer-events:none}
.t-mix .ctext{fill:var(--btn-fg)}
.cluster:hover .cbody, .cluster:focus-visible .cbody{transform:scale(1.1)}
.cbody{transition:transform .15s}
.tip{font-family:var(--font); font-size:calc(17px * var(--u, 1)); fill:var(--ink); stroke:var(--halo); stroke-width:calc(6px * var(--u, 1)); paint-order:stroke; stroke-linejoin:round; text-anchor:middle; pointer-events:none}
.pin-idle{animation:idle 3.2s ease-in-out infinite; animation-delay:calc(var(--i) * -.45s)}
@keyframes idle{0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)}}
.pin:hover .pin-body, .pin:focus-visible .pin-body, .pin.is-hot .pin-body, .pin.is-pinned .pin-body{
  transform:scale(1.1); animation:hop .6s ease both;
}
@keyframes hop{
  0%{transform:translateY(0) scale(1,1)}
  25%{transform:translateY(-14px) scale(.94,1.08)}
  55%{transform:translateY(0) scale(1.1,.9)}
  80%{transform:translateY(-3px) scale(1.06,1.02)}
  100%{transform:translateY(0) scale(1.1,1.1)}
}

/* 資訊面板 */
#panel{position:relative; background:var(--surface); border:2px solid var(--line); padding:20px; min-width:0}
.p-close{position:absolute; top:10px; right:10px; width:40px; height:40px; border-radius:50%; border:2px solid var(--line); background:var(--bg); color:var(--ink); font:inherit; font-size:20px; line-height:1; cursor:pointer; z-index:1; display:grid; place-items:center}
.p-close:hover{background:var(--line)}
.p-close:focus-visible{outline:3px solid var(--focus); outline-offset:2px}
#panel .p-head{padding-right:44px}
@media (min-width:1000px){
  #panel{
    position:absolute; left:14px; bottom:14px; width:clamp(270px,27%,350px); max-height:46%;
    overflow-y:auto; border-radius:24px; box-shadow:0 10px 28px rgba(20,60,50,.2); z-index:2;
  }
  .mapbox.placing #panel, .mapbox.editing #panel{bottom:76px}
}
@media (max-width:999px){ #panel{border-width:2px 0 0 0; border-radius:0} }
#panel h2{font-size:23px; line-height:1.35; margin:0; font-weight:400; overflow-wrap:anywhere}
#panel h3{font-size:14px; margin:18px 0 6px; font-weight:400; color:var(--muted)}
#panel p{margin:10px 0 0}
.longtext{white-space:pre-line; overflow-wrap:anywhere}
.p-head{display:flex; gap:12px; align-items:center}
.p-head > div{min-width:0}
.p-icon{flex:none; width:52px; height:52px; border-radius:50%; background:var(--pin); display:grid; place-items:center}
.p-icon.t-shop{border-radius:10px} .p-icon.t-spa{border-radius:18px} .p-icon.t-hotel{border-radius:16px} .p-icon.t-club{border-radius:12px; transform:rotate(0)} .p-icon.t-food{border-radius:18px}
.p-icon svg{width:32px; height:32px}
.tag{display:inline-block; font-size:13px; line-height:1.5; padding:0 10px; border-radius:999px; background:color-mix(in srgb, var(--pin) 24%, var(--surface)); color:var(--ink)}
.rows{display:grid; grid-template-columns:auto minmax(0,1fr); gap:8px 14px; margin:14px 0 0}
.rows dt{color:var(--muted); font-size:13px}
.rows dd{margin:0; overflow-wrap:anywhere}
.near{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
.near .btn{min-height:36px; padding:2px 14px; font-size:14px}
.go{display:inline-flex; align-items:center; gap:6px; margin-top:18px; min-height:44px; padding:8px 20px; border-radius:999px; background:var(--btn); color:var(--btn-fg); text-decoration:none}
.go:hover{transform:translateY(-2px)}
.go.alt{background:transparent; color:var(--ink); border:2px solid var(--ink); margin-left:8px}
.review{margin-top:14px; padding:12px 14px; border-radius:14px; background:var(--card2, rgba(127,127,127,.12))}
.review h3{margin:0 0 4px}
.pinned-note{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:16px; font-size:13px; color:var(--muted)}
.pinned-note button{font:inherit; font-size:13px; color:var(--ink); background:none; border:2px solid var(--line); border-radius:999px; padding:0 12px; min-height:30px; cursor:pointer}
.index{list-style:none; margin:0; padding:0; display:grid; gap:2px}
.row{width:100%; display:flex; align-items:center; gap:10px; text-align:left; font:inherit; color:var(--ink); background:none; border:0; border-radius:14px; padding:4px 8px; min-height:38px; cursor:pointer}
.row:hover{background:var(--bg)}
.row span.nm{min-width:0; overflow-wrap:anywhere}
.row small{margin-left:auto; flex:none; color:var(--muted); font-size:13px}
.dot{flex:none; width:14px; height:14px; background:var(--pin); border-radius:50%}
.t-hotel .dot, .t-club .dot{border-radius:4px}
.hint{color:var(--muted); font-size:13px}
.empty{color:var(--muted); font-size:14px}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important}
}

/* ===== 手機：文字放大（只在手機版生效，放在最後以蓋過上面的設定） ===== */
@media (max-width:999px){

<main class="wrap">
  <header>
    <h1>峇里島地圖</h1>
    <p class="sub">本島加藍夢島、佩妮達島。滾輪或雙指縮放、拖曳移動，圖示太近時會合併成數字，放大就會散開。位置依地區示意，不是精準座標。</p>
  </header>

  <section class="toolbar" id="toolbar" aria-label="篩選地點">
    <div class="sheet-head"><strong>篩選・搜尋</strong><button class="p-close" type="button" id="tbClose" aria-label="關閉篩選">✕</button></div>
    <fieldset class="cats" id="cats"><legend class="sr">地點類型（可複選）</legend></fieldset>
    <fieldset class="cats subs" id="subs" hidden><legend class="sr">細分類型（可複選）</legend></fieldset>
    <div class="row2">
      <input class="field" id="q" type="search" placeholder="搜尋名稱、地區" aria-label="搜尋名稱或地區" autocomplete="off">
      <select class="field" id="region" aria-label="地區"></select>
      <button class="btn" type="button" id="allBtn">全選</button>
      <button class="btn" type="button" id="noneBtn">全部取消</button>
      <button class="btn tool" type="button" id="placeBtn" aria-pressed="false">取得座標</button>
      <button class="btn" type="button" id="zoneBtn" aria-pressed="true">熱門區域 開</button>
      <button class="btn tool" type="button" id="editBtn" aria-pressed="false">調整位置</button>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <button class="btn done" type="button" id="tbDone">看地圖</button>
  </section>

  <nav id="dock" aria-label="手機操作列"><button class="main" type="button" id="dkFilter">篩選・搜尋</button><button type="button" id="dkList">清單</button><button type="button" id="dkFit">全圖</button></nav>

  <div class="mapbox" id="mapbox">
    <svg id="map" viewBox="0 80 1400 900" role="img" aria-label="峇里島、藍夢島與佩妮達島的插畫地圖"></svg>
    <div class="zoom">
      <button class="zbtn" type="button" id="zin" aria-label="放大">+</button>
      <button class="zbtn" type="button" id="zout" aria-label="縮小">−</button>
      <button class="zbtn fit" type="button" id="zfit" aria-label="重設檢視">全</button>
    </div>
    <div class="maphint" id="hint">滾輪縮放・拖曳移動</div>
    <aside id="panel" aria-live="polite"></aside>
    <div class="coordbar" id="editbar" hidden>
      <span id="editMsg">拖曳圖示到正確的位置。</span>
      <button class="mini" type="button" id="copyPos">複製位置</button>
      <button class="mini" type="button" id="resetPos">全部還原</button>
    </div>
    <div class="coordbar" id="coordbar" hidden>
      <span>點地圖任一處，取得放置物件的座標（畫布 1400 × 1000）</span>
      <input id="coordval" type="text" readonly value="x: -, y: -" aria-label="座標">
      <button class="mini" type="button" id="copyBtn">複製</button>
    </div>
  </div>
</main>

uryabintangadventures.com/", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "raft", "loc": "ll", "lat": -8.439742181410487, "lon": 115.24178997822496, "zone": "mid", "x": 806, "y": 517, "map": "https://www.google.com/maps/search/?api=1&query=-8.439742181410487,115.24178997822496"}, {"id": "p14", "type": "act", "cat": "活動", "sub": "", "region": "彰古", "regionEn": "Canggu", "name": "Nirvana Life Fitness and Wellness Club", "short": "Nirvana Life Fitness", "desc": "健身房。位於峇里島長谷（Canggu）的貝拉瓦海灘附近，是一間結合現代化健身設施與高端養生療程的頂級健康俱樂部。這裡不僅是揮灑汗水的訓練殿堂，更以全方位的身心放鬆與恢復體驗聞名，深受當地居民與海島度假客的喜愛。", "rules": "", "ig": "https://www.instagram.com/nirvanalifebali/", "place": "", "url": "https://nirvanalife.com/bali", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "gym", "loc": "ll", "lat": -8.639362802581173, "lon": 115.15451187282189, "zone": "south", "x": 785, "y": 630, "map": "https://www.google.com/maps/search/?api=1&query=-8.639362802581173,115.15451187282189"}, {"id": "p15", "type": "act", "cat": "活動", "sub": "", "region": "彰古", "regionEn": "Canggu", "name": "Obsidian Gym Bali", "short": "Obsidian Gym Bali", "desc": "健身房。位於峇里島長谷（Canggu）地區，是一間近年備受矚目、風格前衛且設備極其專業的高端健身房。這裡以其低調沉穩的工業風美學與頂級的重量訓練硬體設施聞名，是許多專業健身人士與熱愛訓練的旅客在峇里島的秘密基地。", "rules": "", "ig": "https://www.instagram.com/obsidian.bali/", "place": "OBSIDIAN GYM BALI", "url": "https://www.obsidian-bali.com/", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "gym", "loc": "ll", "lat": -8.632470738254838, "lon": 115.1366980282442, "zone": "south", "x": 764, "y": 623, "map": "https://www.google.com/maps/search/?api=1&query=-8.632470738254838,115.1366980282442"}, {"id": "p16", "type": "spot", "cat": "景點", "sub": "", "region": "塔巴南", "regionEn": "Tabanan", "name": "海神廟(Tanah Lot)", "short": "海神廟(Tanah Lot)", "desc": "海神廟(Tanah Lot)是峇里島最著名的地標之一，位於一座海岸岩石上，因潮水的變化而呈現不同的景觀。在漲潮時，海神廟看起來像是漂浮在海面上的神秘島嶼，而退潮時則可以步行前往一探究竟。這裡不僅是宗教聖地，也因為特殊的地形和優美的夕陽，成為熱門的觀光景點。", "rules": "距離南部熱門觀光區（如庫塔 Kuta 或登帕薩 Denpasar）約 20 公里，車程視交通狀況約需 45 至 60 分鐘。", "ig": "", "place": "Tanah Lot", "url": "https://www.tanahlot.id/", "ticket": "", "usd": "$10.00", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "temple", "loc": "ll", "lat": -8.620957267268755, "lon": 115.08689434510823, "zone": "south", "x": 701, "y": 611, "map": "https://www.google.com/maps/search/?api=1&query=-8.620957267268755,115.08689434510823"}, {"id": "p17", "type": "spot", "cat": "景點", "sub": "", "region": "努沙杜瓦", "regionEn": "Nusa Dua", "name": "努沙杜瓦（Nusa Dua", "short": "努沙杜瓦（Nusa Dua", "desc": "位於峇里島東南部的半島這區，這邊有許多豪華度假村(Resort)，是適合家庭旅遊的高級度假區。這邊大部分的度假村都有自己的私人海灘，這邊的海灘是屬於柔軟的細沙，海浪也很柔和，可以直接在飯店裡玩水踏浪，推薦在這住幾晚體驗看看。", "rules": "很多海上活動行程都在這區，像是海上拖曳傘(Parasailing)、海上飛板(Flyboard)、玩水上摩托車等等。活動地點就在飯店旁邊的海域，有司機到飯店接送，價格也不貴。", "ig": "", "place": "Jimbaran Beach", "url": "", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "beach", "loc": "region", "zone": "south", "x": 858, "y": 871, "map": "https://www.google.com/maps/search/?api=1&query=Jimbaran%20Beach%20Bali"}, {"id": "p18", "type": "spot", "cat": "景點", "sub": "", "region": "金巴蘭", "regionEn": "Jimbaran", "name": "金巴蘭海灘(Jimbaran Beach)", "short": "金巴蘭海灘(Jimbaran Beach)", "desc": "曾被評為全球最美十大日落之一，是欣賞夕陽的絕佳地點。這裡也以海鮮餐廳聞名，遊客可以在海灘上的餐廳享用新鮮的海鮮燒烤，同時欣賞日落美景。來這邊一定要吃日落時段的晚餐，體驗在沙灘上吃燒烤海鮮的特別氛圍，享受原始的美食滋味。", "rules": "另外，晚餐中間可能會有樂隊自己跑來表演，在表演完後會要求小費。雖然感覺有點強迫消費，但出來旅遊開心就好，可以給1~2萬印尼盾意思一下。", "ig": "", "place": "Seminyak Square", "url": "", "ticket": "免費", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "beach", "loc": "ll", "lat": -8.776105599653441, "lon": 115.16645988844539, "zone": "south", "x": 781, "y": 840, "map": "https://www.google.com/maps/search/?api=1&query=-8.776105599653441,115.16645988844539"}, {"id": "p19", "type": "spot", "cat": "景點", "sub": "", "region": "水明漾", "regionEn": "Seminyak", "name": "水明漾廣場(Seminyak Square)", "short": "水明漾廣場(Seminyak Square)", "desc": "位於峇里島南部的水明漾地區，是一座購物中心。不過只有兩層樓高，裡面的品牌也都很普通。水明漾廣場主要是來逛這一區附近的商店街，有許多峇里島特色紀念品店、服飾店、手工製品等等。相較於逛峇里島的傳統夜市(重複性高且多仿冒名牌)，這裡的東西會更有質感，更值得購入當紀念品。這裡也很適合年輕人來玩耍，還有很多高級餐廳和酒吧、夜店、Spa按摩店，並且營業到深夜。很適合峇里島的晚上來這區逛逛，吃飯和按摩。", "rules": "", "ig": "", "place": "Seminyak Square", "url": "http://www.seminyaksquare.com/?utm_source=google&utm_medium=organic&utm_campaign=google_profile&utm_content=website_button", "ticket": "免費", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "star", "loc": "ll", "lat": -8.683342485897159, "lon": 115.15699495222057, "zone": "south", "x": 792, "y": 668, "map": "https://www.google.com/maps/search/?api=1&query=-8.683342485897159,115.15699495222057"}, {"id": "p20", "type": "spot", "cat": "景點", "sub": "", "region": "烏魯瓦圖", "regionEn": "Uluwatu", "name": "烏魯瓦圖神廟(Uluwatu Temple)", "short": "烏魯瓦圖神廟(Uluwatu Temple)", "desc": "位於峇里島最南端的烏魯瓦圖地區(Uluwatu)，坐落於海拔約70公尺的懸崖上，俯瞰壯麗的印度洋景色。該神廟建於10世紀，是峇里島最古老且神聖的寺廟之一，主要供奉海神。由於其獨特的地理位置，這裡成為觀賞夕陽的絕佳地點。每當夕陽西下，烏魯瓦圖神廟的圓形劇場會上演傳統的卡恰火舞（Kecak Fire Dance）表演，該表演主要重現印度教史詩《羅摩衍那》（Ramayana）中的一段故事，內容包括猴王與惡魔之間的戰鬥等情節。表演時間通常在傍晚6點開始，建議提前購買門票以確保座位。通往烏魯瓦圖神廟的道路很容易塞車，建議提早抵達，或上一個行程不要安排太遠。", "rules": "需要注意的是，神廟周圍有許多猴子，牠們可能會對遊客的眼鏡、帽子等物品感興趣，建議妥善保管個人物品。此外，進入神廟時，遊客需遵守服裝規定，穿著覆蓋膝蓋的服裝，若無合適服裝，入口處提供紗籠(圍裙)供遊客使用。", "ig": "", "place": "Uluwatu Temple", "url": "https://maps.app.goo.gl/WnF4Wkq49gxcz4v26", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "$230.00", "kkday": "", "review": "", "icon": "temple", "loc": "ll", "lat": -8.829033295874908, "lon": 115.08496825122384, "zone": "south", "x": 715, "y": 898, "map": "https://www.google.com/maps/search/?api=1&query=-8.829033295874908,115.08496825122384"}, {"id": "p21", "type": "spot", "cat": "景點", "sub": "", "region": "烏魯瓦圖", "regionEn": "Uluwatu", "name": "卡恰火舞表演", "short": "卡恰火舞表演", "desc": "以絕美日落為背景，卡恰火舞秀帶領觀眾進入目眩神迷的神話世界", "rules": "每日主要分為兩個場次：• 第一場：18:00 – 19:00• 第二場：19:00 – 20:00", "ig": "", "place": "Uluwatu Temple", "url": "https://maps.app.goo.gl/WnF4Wkq49gxcz4v26", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "$261.00", "kkday": "$1,627.00", "review": "", "icon": "temple", "loc": "ll", "lat": -8.829033295874908, "lon": 115.08496825122384, "zone": "south", "x": 715, "y": 898, "map": "https://www.google.com/maps/search/?api=1&query=-8.829033295874908,115.08496825122384"}, {"id": "p22", "type": "spot", "cat": "景點", "sub": "", "region": "庫塔", "regionEn": "Kuta", "name": "Waterbom水樂園", "short": "Waterbom水樂園", "desc": "位於庫塔（Kuta）市中心，是亞洲頂級的水上樂園之一，佔地約3.8公頃。園區內擁有多樣化的滑水道和水上設施，適合各年齡層的遊客。其中，The Climax 是亞洲最陡峭的滑水道之一，可以挑戰一下自己的勇氣。當然也有其他輕鬆的玩水設施，像是漂漂河之類的，和許多泳池酒吧。在赤道附近的峇里島天氣炎熱，非常適合來這邊玩水。", "rules": "園區內設有多家餐廳和咖啡廳，提供各式美食，滿足不同口味的需求。此外，Waterbom水樂園採用無現金支付系統，遊客會在入園時取得手環，儲值後在園區內消費。", "ig": "", "place": "Waterbom Bali", "url": "https://waterbom-bali.com/", "ticket": "", "usd": "", "idr": "Rp550,000", "twd": "", "klook": "$1,144.00", "kkday": "$1,074.00", "review": "", "icon": "star", "loc": "ll", "lat": -8.728337594631217, "lon": 115.1692512490731, "zone": "south", "x": 803, "y": 741, "map": "https://www.google.com/maps/search/?api=1&query=-8.728337594631217,115.1692512490731"}, {"id": "p23", "type": "spot", "cat": "景點", "sub": "", "region": "庫塔", "regionEn": "Kuta", "name": "庫塔海灘 (Kuta Beach)", "short": "庫塔海灘 (Kuta Beach)", "desc": "峇里島是著名的衝浪聖地，有各種不同的浪型可以玩，大中小都有。其中庫塔海灘 (Kuta Beach)最適合新手，也是峇里島著名的海灘之一。這裡擁有綿延的金色沙灘和平穩的海浪，特別適合衝浪初學者。此外，庫塔海灘的日落美景也是旅客不容錯過的亮點。庫塔海灘除了衝之外，也有熱鬧的夜生活，這區聚集了許多酒吧、海灘俱樂部(beach club)和夜店，夜生活豐富多彩，適合喜歡熱鬧的旅客。", "rules": "", "ig": "", "place": "Kuta Beach", "url": "http://kutabeachbalii.com/", "ticket": "免費", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "beach", "loc": "ll", "lat": -8.717915978015428, "lon": 115.16861579355093, "zone": "south", "x": 801, "y": 737, "map": "https://www.google.com/maps/search/?api=1&query=-8.717915978015428,115.16861579355093"}, {"id": "p24", "type": "spot", "cat": "景點", "sub": "", "region": "吉安雅", "regionEn": "Gianyar", "name": "聖泉寺(Pura Tirta Empul)", "short": "聖泉寺(Pura Tirta Empul)", "desc": "建於西元926年，是峇里島五大神聖寺廟之一，也是峇里島最神聖的水源之一，敬拜的是印度教的水神毘濕奴。裡面的水池是進行聖泉浴的地方，當地人相信到此處用聖水沖洗可以淨化靈魂。因為聖泉寺內外院都對外開放，因此也成為峇里島熱門的觀光景點之一，經常在明信片上面看到的水池浴照就是在這邊。", "rules": "不可穿著短褲，寺廟前有免費提供紗籠(圍裙)，所以衣著不會有影響。長髮者需要把頭髮綁起來。女性經期來時不可進入。如果要參加淨化儀式，會需要額外費用，只能現金支付，要記得帶夠。", "ig": "", "place": "Pura Tirta Empul", "url": "https://gianyartourismticket.com/en/detail/titra-empul%20", "ticket": "", "usd": "", "idr": "Rp50,000", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "temple", "loc": "ll", "lat": -8.415406618780272, "lon": 115.31542216359796, "zone": "mid", "x": 887, "y": 468, "map": "https://www.google.com/maps/search/?api=1&query=-8.415406618780272,115.31542216359796"}, {"id": "p25", "type": "spot", "cat": "景點", "sub": "", "region": "烏布", "regionEn": "Ubud", "name": "烏布皇宮(Ubud Palace)", "short": "烏布皇宮(Ubud Palace)", "desc": "位於峇里島烏布市中心，是體驗峇里島傳統文化的必訪景點。這座宮殿裡有許多外觀精美的石刻藝術，展現了峇里島傳統建築的美麗。雖然宮殿規模不大，但其歷史價值和文化意義深遠。遊客可以參觀庭院和部分開放的建築區域，傍晚時分還能欣賞到傳統的峇里島舞蹈表演。由於位置方便，建議搭配附近的烏布市場一同遊覽。進入烏布皇宮不需要門票，裡面範圍不大，可以參觀的區域走馬看花10分鐘就結束。烏布皇宮目前還是皇室成員的住所，所以有些區域會掛在禁止進入的牌子，避免觀光客誤入住宅。", "rules": "烏布皇宮每天晚上會有傳統舞蹈表演，每天的主題稍有不同，主要是以雷貢舞(Legong Dance)為主。因為是戶外表演，記得帶防蚊液。", "ig": "", "place": "Ubud Palace", "url": "https://maps.app.goo.gl/LjxceK6uThwDBHrt8", "ticket": "免費", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "star", "loc": "ll", "lat": -8.50641730775272, "lon": 115.26253475221846, "zone": "mid", "x": 849, "y": 574, "map": "https://www.google.com/maps/search/?api=1&query=-8.50641730775272,115.26253475221846"}, {"id": "p26", "type": "spot", "cat": "景點", "sub": "", "region": "烏布", "regionEn": "Ubud", "name": "烏布水皇宮", "short": "烏布水皇宮", "desc": "烏布水皇宮(Ubud Water Palace)的正名是莎拉斯瓦蒂水神廟(Pura Taman Saraswati)。「Pura」 在峇里語中意為 「寺廟」，專指印度教寺廟。「Taman」 意為 「花園」或「水庭院」，指的是寺廟內的蓮花池景觀。「Saraswati」 指的是 「莎拉斯瓦蒂女神」，是印度教中智慧、學識與藝術的守護神。烏布水皇宮建於1952年，而且其實不是宮殿，是一座峇里島印度廟。因為寺廟的外觀且是由烏布王室建造，有宮殿式建築與水池，因此才被稱為「水皇宮」。裡面能參觀的範圍不大，有一個很大的蓮花池，還算好拍照，有路過或是到烏布皇宮的話，可以順路來參觀。", "rules": "白天可以免費進入參觀，來這邊拍照，欣賞皇宮的精緻石雕。裡面的空間不大，10分鐘就可以走完，加上拍照，大概30分鐘吧。如果想要來坐著放空，旁邊有一間咖啡廳Cafe Lotus(map)正對著蓮花池，可以邊吃東西邊欣賞皇宮。在晚上，水皇宮會舉行傳統的峇里舞蹈表演，如Legong Dance等，每日的表演舞蹈不同，參考官網，讓遊客體驗當地的文化藝術。建議提前詢問表演時間並預訂座位。", "ig": "", "place": "Ubud Water Palace", "url": "http://www.ubudwaterpalace.com/", "ticket": "", "usd": "", "idr": "Rp65,000", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "star", "loc": "ll", "lat": -8.50563526410406, "lon": 115.26135073846118, "zone": "mid", "x": 848, "y": 574, "map": "https://www.google.com/maps/search/?api=1&query=-8.50563526410406,115.26135073846118"}, {"id": "p27", "type": "shop", "cat": "商場", "sub": "", "region": "烏布", "regionEn": "Ubud", "name": "烏布市場", "short": "烏布市場", "desc": "烏布市場(Ubud Market)又稱為烏布藝術市場，因為烏布是峇里島的藝術文化起源地。這裡的市場有很多工藝品，逛了一圈下來後，心得是確實很好買，物品有特色，很推薦來買紀念品。就算不買東西，只參觀也很不錯。本文帶大家欣賞一下烏布市場裡面有賣哪些東西。如果有要來烏布市場買東西的話，記得一定要殺價，體驗一下峇里島的購物文化。", "rules": "可以從價格的3~5折開始喊起，再慢慢往上加。一次買多一點，比較有折扣空間。對想要的商品要展現的不是很想買，也會比較好殺價。", "ig": "", "place": "Ubud Art Market", "url": "https://maps.app.goo.gl/2j1kVkhddrnx1xGJ6", "ticket": "免費", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "bag", "loc": "ll", "lat": -8.507192153814813, "lon": 115.26280064201666, "zone": "mid", "x": 850, "y": 575, "map": "https://www.google.com/maps/search/?api=1&query=-8.507192153814813,115.26280064201666"}, {"id": "p28", "type": "spot", "cat": "景點", "sub": "", "region": "烏布", "regionEn": "Ubud", "name": "德哥拉朗梯田(Tegallalang Rice Terrace)", "short": "德哥拉朗梯田(Tegallalang Rice Ter…", "desc": "位於峇里島中部的烏布北方，以其層層疊疊的稻田景觀聞名，是自由行旅客的熱門打卡景點。該地區的蘇巴克（Subak）灌溉系統，展現了人與自然和諧共存的精神，並於2012年被列入世界文化遺產。德哥拉朗梯田是來走走參觀梯田步道，沒有一定的入口。建議穿著舒適的鞋子，梯田步道可能陡峭且泥濘。最佳造訪時間為清晨或傍晚，避免正午的高溫。", "rules": "因為在梯田步道間穿梭，會經過不同地主的土地，所以可能會被收取好幾次過路費，建議攜帶小額現金以備不時之需。也可以直接報名相關行程，比較乾脆，這裡已經很商業化，周圍有許多咖啡廳和付費活動，像是高空鞦韆、空中自行車等等。", "ig": "", "place": "", "url": "https://maps.app.goo.gl/JUcA3E1ibBiasPRu5", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "terrace", "loc": "region", "zone": "mid", "x": 859, "y": 546, "map": "https://www.google.com/maps/search/?api=1&query=%E5%BE%B7%E5%93%A5%E6%8B%89%E6%9C%97%E6%A2%AF%E7%94%B0%28Tegallalang%20Rice%20Terrace%29%20Bali"}, {"id": "p29", "type": "spot", "cat": "景點", "sub": "", "region": "吉安雅", "regionEn": "Gianyar", "name": "聖猴森林公園（Sacred Monkey Forest Sanctuary）", "short": "聖猴森林公園（Sacred Monkey Forest…", "desc": "是一個結合自然與文化的旅遊景點，位於烏布地區，這裡有茂密的森林和超過700隻的長尾獼猴自由活動。除了觀賞猴子的生態，園內還有三座古老的印度教寺廟，充滿濃厚的文化氛圍，是了解峇里島文化與宗教信仰的好地方。", "rules": "建議遊客攜帶一些小零食或水果作為與猴子互動的道具，但要注意保持距離，避免不必要的騷擾。", "ig": "", "place": "", "url": "https://maps.app.goo.gl/3G42b8uRCNMdRdyN9", "ticket": "", "usd": "", "idr": "Rp130,000", "twd": "", "klook": "$182.00", "kkday": "", "review": "", "icon": "star", "loc": "ll", "lat": -8.519107430122196, "lon": 115.26075864214887, "zone": "mid", "x": 849, "y": 584, "map": "https://www.google.com/maps/search/?api=1&query=-8.519107430122196,115.26075864214887"}, {"id": "p30", "type": "spot", "cat": "景點", "sub": "", "region": "邦利", "regionEn": "Bangli", "name": "彭里普蘭村(Penglipuran Village)", "short": "彭里普蘭村(Penglipuran Village)", "desc": "位於峇里島中北部的邦利（Bangli）區，是一座保存完好的傳統村落，以其獨特的文化和建築風格而聞名。該村莊被譽為世界上最乾淨的村莊之一，村民們自小被教育不能隨意亂丟垃圾，並積極從事資源回收及環保工作，讓這個古老村落顯得乾淨又整齊。村莊的主要特色包括：傳統建築：彭里普蘭村的房屋保留了傳統的峇里島建築風格，排列整齊，展現出濃厚的文化氛圍。文化遺產：村民們至今仍遵循祖先傳承的文化秩序，保持著傳統的生活方式和習俗。自然環境：村莊周圍環境優美，空氣清新，提供遊客一個放鬆身心的好去處。", "rules": "不能隨意亂丟垃圾", "ig": "", "place": "Penglipuran Village", "url": "https://visitpenglipuran.com/", "ticket": "", "usd": "", "idr": "Rp50,000", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "temple", "loc": "ll", "lat": -8.422227950284485, "lon": 115.3598496556425, "zone": "mid", "x": 930, "y": 479, "map": "https://www.google.com/maps/search/?api=1&query=-8.422227950284485,115.3598496556425"}, {"id": "p31", "type": "spot", "cat": "景點", "sub": "", "region": "吉安雅", "regionEn": "Gianyar", "name": "Safari野生動物園(The Amazing Taman Safari Bali)", "short": "Safari野生動物園(The Amazing Tam…", "desc": "佔地約 40 公頃，園區內飼養了來自印尼、印度和非洲大草原的多種野生動物。遊客可搭乘遊園車近距離觀察大象、獅子、老虎等 60 多種動物，體驗難忘的遊獵之旅。此外，園區內還提供精彩的動物表演、娛樂活動，以及主題餐廳和水族館等設施，適合親子同遊。", "rules": "日間動物園每日 09:00 – 17:00、夜間動物園 18:00 – 21:00", "ig": "", "place": "Taman Safari", "url": "https://tamansafari.com/taman-safari-bali/", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "$1,362.00", "kkday": "", "review": "", "icon": "star", "loc": "ll", "lat": -8.581937673793806, "lon": 115.34720365195726, "zone": "mid", "x": 941, "y": 621, "map": "https://www.google.com/maps/search/?api=1&query=-8.581937673793806,115.34720365195726"}, {"id": "p32", "type": "spot", "cat": "景點", "sub": "", "region": "吉安雅", "regionEn": "Gianyar", "name": "Marine Safari Bali", "short": "Marine Safari Bali", "desc": "是印尼知名 Taman Safari 集團所打造的全新大型海洋生態與野生動物園區，位於峇里島吉安雅（Gianyar）地區，緊鄰原本就非常熱門的 Bali Safari & Marine Park 園區旁。", "rules": "", "ig": "", "place": "", "url": "https://tamansafari.com/marine-safari-bali/", "ticket": "https://www.instagram.com/marinesafaribali/", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "$1,179.00", "review": "", "icon": "star", "loc": "ll", "lat": -8.581481498983514, "lon": 115.34702126176431, "zone": "mid", "x": 941, "y": 620, "map": "https://www.google.com/maps/search/?api=1&query=-8.581481498983514,115.34702126176431"}, {"id": "p33", "type": "spot", "cat": "景點", "sub": "", "region": "烏布", "regionEn": "Ubud", "name": "德格拉朗瀑布(Tegenungan Waterfall)", "short": "德格拉朗瀑布(Tegenungan Waterfall)", "desc": "位於峇里島烏布附近的 Kemenuh 村，是該地區少數不在高地或山區的瀑布之一，因為非常容易抵達，所以成為熱門的看瀑布景點。瀑布水量充沛，周圍環境綠意盎然，許多人都來這邊玩水、打卡拍照。", "rules": "德格努冷瀑布因為很熱門，環境比較商業化，可能會支付比較多的小費或過路費，和一般期望的秘境瀑布不太一樣。網路常看到的空中盪鞦韆照片和鳥巢照片就在這邊，只是都需要額外付費。", "ig": "", "place": "Tegenungan Waterfall", "url": "https://maps.app.goo.gl/fTGNCcu5xJc5rTSg7", "ticket": "免費", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "fall", "loc": "ll", "lat": -8.575118095363917, "lon": 115.28898672209063, "zone": "mid", "x": 886, "y": 598, "map": "https://www.google.com/maps/search/?api=1&query=-8.575118095363917,115.28898672209063"}, {"id": "p34", "type": "spot", "cat": "景點", "sub": "", "region": "佩妮達島", "regionEn": "Penida", "name": "珀尼達島(Nusa Penida)", "short": "珀尼達島(Nusa Penida)", "desc": "面積約200平方公里，大概是一個台北市大小。這邊的海水、海灘是更清澈乾淨，並有壯麗的自然景觀，是許多自由行旅客會來玩耍的地方。這邊建議跟團包車跑景點，會比較安全且方便，因為島上的道路崎嶇，天氣也很炎熱。在島上的跟團會是A進B出的搭車＋搭船去浮潛＋換另一台車接手載人＋另一個碼頭回本島。珀尼達島的熱門行程是跑島嶼的西側，東側也有自己的行程景點，但就會拉車比較遠。西側主要景點有：", "rules": "要繳交上島稅", "ig": "", "place": "Penida Island", "url": "https://maps.app.goo.gl/FJnCFyVm4qdof6sH8", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "palm", "loc": "ll", "lat": -8.68940949044041, "lon": 115.48133557455377, "zone": "isle", "x": 1032, "y": 793, "map": "https://www.google.com/maps/search/?api=1&query=-8.68940949044041,115.48133557455377"}, {"id": "p35", "type": "spot", "cat": "景點", "sub": "", "region": "佩妮達島", "regionEn": "Penida", "name": "恐龍海灘(Kelingking Beach)", "short": "恐龍海灘(Kelingking Beach)", "desc": "因懸崖形狀酷似暴龍頭而聞名，從高處俯瞰，景色壯觀。可沿著陡峭的步道下至沙灘，但需注意安全。", "rules": "要繳交景點稅", "ig": "", "place": "Kelinking beach", "url": "https://maps.app.goo.gl/6Zsy5LhDYpvyyX357", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "beach", "loc": "ll", "lat": -8.750345413510967, "lon": 115.47423424963246, "zone": "isle", "x": 1023, "y": 848, "map": "https://www.google.com/maps/search/?api=1&query=-8.750345413510967,115.47423424963246"}, {"id": "p36", "type": "spot", "cat": "景點", "sub": "", "region": "佩妮達島", "regionEn": "Penida", "name": "天使浴池(Angel’s Billabong)", "short": "天使浴池(Angel’s Billabong)", "desc": "天然形成的無邊際泳池，清澈見底的水面連接著湛藍的大海，是拍照的絕佳地點。在這邊浮潛的話，有機會可以看到鬼蝠魟(Manta)，也就是俗稱的魔鬼魚。", "rules": "要繳交景點稅", "ig": "", "place": "Angel's Billabong", "url": "https://maps.app.goo.gl/6c2TWK43Ak2Y4xtx5", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "star", "loc": "ll", "lat": -8.733335931175215, "lon": 115.44898952883487, "zone": "isle", "x": 1001, "y": 829, "ma desc": "位於島東北角，遊客可以搭船探索紅樹林的幽靜景色。", "rules": "", "ig": "", "place": "Mangrove Point", "url": "https://maps.app.goo.gl/UQDwaj4niH1QyDrbA", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "palm", "loc": "ll", "lat": -8.664237627504324, "lon": 115.46646811235561, "zone": "isle", "x": 1013, "y": 766, "map": "https://www.google.com/maps/search/?api=1&query=-8.664237627504324,115.46646811235561"}, {"id": "p44", "type": "spot", "cat": "景點", "sub": "", "region": "藍夢島", "regionEn": "Nusa Lembongan", "name": "黃色鐵橋（Yellow Bridge）", "short": "黃色鐵橋（Yellow Bridge）", "desc": "這座橋連接藍夢島與金銀島，是著名的打卡地標。", "rules": "", "ig": "", "place": "yellow bridge", "url": "https://maps.app.goo.gl/DqpdJt5NDeqZZrrd8", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "star", "loc": "ll", "lat": -8.693427199864907, "lon": 115.4510892289202, "zone": "isle", "x": 1005, "y": 800, "map": "https://www.google.com/maps/search/?api=1&query=-8.693427199864907,115.4510892289202"}, {"id": "p45", "type": "spot", "cat": "景點", "sub": "", "region": "金銀島", "regionEn": "Nusa Ceningan", "name": "金銀島(Nusa Ceningan)", "short": "金銀島(Nusa Ceningan)", "desc": "位於峇里島東南方，與藍夢島相鄰，透過著名的黃色鐵橋（Yellow Bridge）相連。這座島以純樸的自然風光和悠閒的氛圍吸引著遊客。", "rules": "", "ig": "", "place": "Ceningan island", "url": "https://maps.app.goo.gl/uipvQGdKTwoDWLnK6", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "palm", "loc": "ll", "lat": -8.69617059441122, "lon": 115.45145788067903, "zone": "isle", "x": 1005, "y": 802, "map": "https://www.google.com/maps/search/?api=1&query=-8.69617059441122,115.45145788067903"}, {"id": "p46", "type": "spot", "cat": "景點", "sub": "", "region": "金銀島", "regionEn": "Nusa Ceningan", "name": "藍色潟湖（Blue Lagoon）", "short": "藍色潟湖（Blue Lagoon）", "desc": "以湛藍海水聞名的美麗海灣，適合拍照和欣賞自然景觀。", "rules": "", "ig": "", "place": "Blue Lagoon View", "url": "https://maps.app.goo.gl/Ko1FxAZcWy6qSyg97", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "beach", "loc": "ll", "lat": -8.704120274445406, "lon": 115.4378663461148, "zone": "isle", "x": 1000, "y": 803, "map": "https://www.google.com/maps/search/?api=1&query=-8.704120274445406,115.4378663461148"}, {"id": "p47", "type": "spot", "cat": "景點", "sub": "", "region": "昆布", "regionEn": "Kubu", "name": "阿貢火山（Gunung Agung）", "short": "阿貢火山（Gunung Agung）", "desc": "是峇里島的最高峰，海拔3,031公尺，被當地人視為聖山。", "rules": "阿貢火山是可以攀爬的，當地人也會來朝聖。不過攀登前應留意當地火山活動資訊，確保安全。登山來回時間需要12-16小時，需拔升約2,000公尺，全程幾乎為緩上坡，地形多為火山細砂石，上坡時容易滑動，下山時更需小心。通常是在半夜12點啟登，在山頂看日出壯麗景色，然後再下山。由於路線難度較高，建議有當地嚮導帶路比較安全。", "ig": "", "place": "Mount Agung", "url": "https://maps.app.goo.gl/UhYVcpNgyaReH83v9", "ticket": "免費", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "volcano", "loc": "ll", "lat": -8.339929502308145, "lon": 115.50738273149355, "zone": "long", "x": 1134, "y": 374, "map": "https://www.google.com/maps/search/?api=1&query=-8.339929502308145,115.50738273149355"}, {"id": "p48", "type": "spot", "cat": "景點", "sub": "", "region": "金塔瑪尼", "regionEn": "Kintamani", "name": "巴杜爾火山(Gunung Batur)", "short": "巴杜爾火山(Gunung Batur)", "desc": "拔1,717公尺，是一座活火山，最近的噴發時間是在1999年。火山口內有一座高700公尺的複式火山，並擁有壯麗的巴杜爾湖景觀。巴杜爾火山也可以攀爬，路程比阿貢火山容易許多，只要2小時就能登頂。通常在凌晨4點開始，在山頂看日出後下山。若不想攀登，可前往金塔馬尼的觀景餐廳，一邊享用餐點，一邊欣賞火山與湖泊的壯麗景色。", "rules": "", "ig": "", "place": "Mt Batur", "url": "https://maps.app.goo.gl/g67daa841Tjox2Nn6", "ticket": "免費", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "volcano", "loc": "ll", "lat": -8.238486265679725, "lon": 115.37758023067902, "zone": "far", "x": 1026, "y": 340, "map": "https://www.google.com/maps/search/?api=1&query=-8.238486265679725,115.37758023067902"}, {"id": "p49", "type": "spot", "cat": "景點", "sub": "", "region": "東部地區", "regionEn": "East Bali", "name": "蒂爾塔岡加水宮(Tirta Gangga)", "short": "蒂爾塔岡加水宮(Tirta Gangga)", "desc": "是一座前皇家水上花園，建於1948年。園區佔地約1.2公頃，由多層次的水池、噴泉、雕像和花園組成，環境優雅寧靜，很適合來這邊拍照走走。水宮裡面有自己的餐廳和飯店，也可以住在裡面，來一個深度旅行。十一層噴泉：園區中央矗立著優雅的十一層Nawa Sanga噴泉，是蒂爾塔岡加的標誌性建築。水池與雕像：池塘內設有步道，遊客可在水上石階上行走，欣賞池中大型鯉魚和周圍的傳統雕像。游泳池：園區內有三個游泳池，供遊客戲水放鬆，水源來自天然泉水，清涼宜人。可以攜帶泳衣來此游泳玩水。", "rules": "", "ig": "", "place": "Tirta Gangga", "url": "https://tirtaganggabali.com/", "ticket": "", "usd": "", "idr": "", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "star", "loc": "ll", "lat": -8.402116158222373, "lon": 115.58826550896032, "zone": "long", "x": 1236, "y": 417, "map": "https://www.google.com/maps/search/?api=1&query=-8.402116158222373,115.58826550896032"}, {"id": "p50", "type": "spot", "cat": "景點", "sub": "", "region": "塔巴南", "regionEn": "Tabanan", "name": "布拉坦水神廟(Pura Ulun Danu Bratan)", "short": "布拉坦水神廟(Pura Ulun Danu Brata…", "desc": "位於峇里島的布拉坦湖畔，是一座供奉水、湖泊和河流女神德維·達努（Dewi Danu）的印度教寺廟。建於1633年，水神廟因其浮在湖面的夢幻景觀成為熱門的打卡景點。這裡不僅是靈性信仰的中心，還是峇里島農業灌溉的重要象徵。此外，水神廟的形象還出現在印尼的五萬盾紙幣上，是峇里島文化的標誌之一。", "rules": "布拉坦水神廟的位置在峇里島偏北方，再加上路況不好，裡面能逛的不多，如果有到烏布或北部火山，再來這邊順遊就好。建議早晨或傍晚前往，可以避開人潮並欣賞湖畔的迷人日出或夕陽。", "ig": "", "place": "Ulun Danu Beratan Temple", "url": "https://maps.app.goo.gl/7sCoC7PTj1mV9K3L9", "ticket": "", "usd": "", "idr": "Rp100,000", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "temple", "loc": "ll", "lat": -8.257912663376288, "lon": 115.17201040423512, "zone": "far", "x": 810, "y": 338, "map": "https://www.google.com/maps/search/?api=1&query=-8.257912663376288,115.17201040423512"}, {"id": "p51", "type": "spot", "cat": "景點", "sub": "", "region": "卡朗阿森", "regionEn": "Karangasem", "name": "百沙基母廟（Pura Besakih）", "short": "百沙基母廟（Pura Besakih）", "desc": "位於峇里島東部的阿貢火山南坡，被視為峇里島最神聖的印度教寺廟。該廟由22座寺廟組成，沿山而建，主廟的「善惡門」是著名的拍照景點。百沙基母廟的歷史可追溯至14世紀，1963年阿貢火山爆發時，熔岩流經寺廟附近但未摧毀建築，被視為神蹟。", "rules": "進入廟宇區域必須穿著沙龍（Sarong）並繫上腰帶。", "ig": "", "place": "Besakih Great Temple", "url": "https://www.besakih.org/", "ticket": "", "usd": "", "idr": "Rp150,000", "twd": "", "klook": "", "kkday": "", "review": "", "icon": "temple", "loc": "ll", "lat": -8.373758774786797, "lon": 115.4526210730 function smooth(pts, closed){
  const n = pts.length;
  const g = i => closed ? pts[(i+n)%n] : pts[Math.max(0, Math.min(n-1, i))];
  let d = 'M'+f1(pts[0][0])+' '+f1(pts[0][1]);

    const p0=g(i-1), p1=g(i), p2=g(i+1), p3=g(i+2);

function segDist(px, py, a, b){
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const t = Math.max(0, Math.min(1, ((px-a[0])*dx + (py-a[1])*dy) / ((dx*dx + dy*dy) || 1)));
  return Math.hypot(px-(a[0]+t*dx), py-(a[1]+t*dy));
}
const edgeDist = (x, y, poly) => Math.min(...poly.map((p, i) => segDist(x, y, p, poly[(i+1) % poly.length])));
function blobE(cx, cy, rx, ry, seed){
  const rand = rng(seed);
  return Array.from({length:10}, (_, i) => {
    const a = i*Math.PI/5, k = 0.88+rand()*0.24;
    return [cx+Math.cos(a)*rx*k, cy+Math.sin(a)*ry*k];
  });
}
function palm(x, y, s, lean){
  const tx = lean*1.6, ty = -26;
  const angs = [-165,-110,-65,-15,25,155];
  const leaves = angs.map((a, i) => '<ellipse rx="13" ry="4.6" transform="rotate('+a+') translate(11 0)" class="'+(i%2?'c-crown2':'c-crown')+'"/>').join('');
  return '<g transform="translate('+x+' '+y+') scale('+s+')"><ellipse cy="2" rx="11" ry="3.5" fill="#000" opacity=".12"/>'
    + '<path d="M0 0 Q'+lean+' -14 '+tx+' '+ty+'" stroke="var(--trunk)" stroke-width="4" fill="none" stroke-linecap="round"/>'
    + '<g transform="translate('+tx+' '+ty+')">'+leaves+'<circle r="3" fill="var(--trunk)"/></g></g>';
}
function cloud(y, dur, del, s){
  return '<g transform="translate(0 '+y+') scale('+s+')"><g class="cloud" style="--dur:'+dur+'s;--del:'+del+'s"><ellipse rx="48" ry="16" class="c-cloud"/><circle cx="-16" cy="-10" r="18" class="c-cloud"/><circle cx="14" cy="-15" r="23" class="c-cloud"/></g></g>';
}
function terrace(x, y, rot){
  const w = [48, 40, 32, 24];
  return '<g transform="translate('+x+' '+y+') rotate('+rot+')">'
    + w.map((k, i) => '<path class="c-terr" d="M'+(-k)+' '+(i*11)+' Q0 '+(i*11-16)+' '+k+' '+(i*11)+'"/>').join('') + '</g>';
}

/* ===== 畫出群島 ===== */
const ISLETS = [
  {cx:1088, cy:822, rx:98, ry:58, seed:5},   // 佩妮達島
  {cx:990, cy:770, rx:29, ry:22, seed:9},    // 藍夢島
  {cx:1010, cy:800, rx:13, ry:9, seed:2}     // 珍寧岸
];
const LAKES = [
  {x:1010, y:322, rx:26, ry:42, rot:25},
  {x:735, y:308, rx:22, ry:12, rot:-10}
];
const TERR = [[840,430,5],[905,392,-6],[480,300,-4],[570,325,6],[300,330,0]];
let clipN = 0;

function buildMap(){
  const isletPts = ISLETS.map(o => blobE(o.cx, o.cy, o.rx, o.ry, o.seed));
  const shapes = [ISLAND].concat(isletPts);
  const rand = rng(21);
  let s = '<rect x="-400" y="-400" width="2200" height="1800" fill="var(--sea)"/>';

  let w = 0;
  for(let n=0; n<4000 && w<44; n++){
    const x = 20+rand()*1330, y = 95+rand()*850;
    if(shapes.some(pts => inPoly(x, y, pts) || edgeDist(x, y, pts) < 58)) continue;
    s += '<path class="c-wave wave" style="--i:'+w+'" d="M'+f1(x)+' '+f1(y)+' q7 -7 14 0 t14 0 t14 0"/>';
    w++;
  }

  const paths = shapes.map(pts => smooth(pts, true));
  paths.forEach((d, i) => { s += '<path d="'+d+'" fill="var(--shallow)" stroke="var(--shallow)" stroke-width="'+(i ? 40 : 58)+'" stroke-linejoin="round"/>'; });
  let mainClip = '';
  paths.forEach((d, i) => {
    const id = 'cl'+(clipN++); if(!i) mainClip = id;
    s += '<path d="'+d+'" class="c-grass"/><clipPath id="'+id+'"><path d="'+d+'"/></clipPath>'
      + '<path d="'+d+'" fill="none" stroke="var(--sand)" stroke-width="'+(i ? 22 : 30)+'" stroke-linejoin="round" clip-path="url(#'+id+')"/>';
  });

  /* 車程分區：圓潤的粉彩色塊＋點點花紋＋縫線邊框＋小旗子 */
  const wavy = pts => {
    let d = '';
    pts.forEach((a, i) => {
      const c = pts[(i+1) % pts.length], dx = c[0]-a[0], dy = c[1]-a[1], len = Math.hypot(dx, dy) || 1;
      const n = Math.max(2, Math.round(len/46)), nx = -dy/len*7, ny = dx/len*7;
      if(!i) d += 'M'+a[0]+' '+a[1];
      for(let k = 0; k < n; k++){
        const t1 = (k+.5)/n, t2 = (k+1)/n, sg = k % 2 ? -1 : 1;
        d += ' Q'+f1(a[0]+dx*t1+nx*sg)+' '+f1(a[1]+dy*t1+ny*sg)+' '+f1(a[0]+dx*t2)+' '+f1(a[1]+dy*t2);
      }
    });
    return d + 'Z';
  };
  const zflag = (k, x, y, label) => {
    const w = label.length * 19 + 26;
    return '<g class="zflag zf" data-z="'+k+'" style="transform:translate('+x+'px,'+y+'px) scale(calc(var(--u,1) * var(--zf,1)))"><path d="M-6 16 L0 30 L6 16Z" fill="'+ZDEF[k].d+'"/>'
      + '<rect x="'+(-w/2)+'" y="-17" width="'+w+'" height="34" rx="17" fill="#fff" stroke="'+ZDEF[k].d+'" stroke-width="3.5"/>'
      + '<circle cx="'+(-w/2+16)+'" cy="0" r="5" fill="'+ZDEF[k].c+'" stroke="'+ZDEF[k].d+'" stroke-width="2"/>'
      + '<text x="'+(8)+'" y="6" text-anchor="middle" fill="'+ZDEF[k].d+'">'+label+'</text></g>';
  };
  s += '<defs><pattern id="zdots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.2" fill="#fff" opacity=".42"/><circle cx="12" cy="12" r="2.2" fill="#fff" opacity=".42"/></pattern></defs>';
  s += '<g id="zonesFill"><path class="zf zf-fill" data-z="long" d="'+paths[0]+'" fill="'+ZDEF.long.c+'"/>'
    + '<path class="zf zf-dots" data-z="long" d="'+paths[0]+'" fill="url(#zdots)"/>'
    + ZONEPOLY.map(z => { const d = wavy(z.pts); return '<g class="zf" data-z="'+z.key+'" clip-path="url(#'+mainClip+')"><path class="zf-fill" d="'+d+'" fill="'+ZDEF[z.key].c+'"/><path class="zf-dots" d="'+d+'" fill="url(#zdots)"/><path class="zf-line" d="'+d+'"/></g>'; }).join('')
    + paths.slice(1).map(d => '<g class="zf" data-z="isle"><path class="zf-fill" d="'+d+'" fill="'+ZDEF.isle.c+'"/><path class="zf-dots" d="'+d+'" fill="url(#zdots)"/></g>').join('') + '</g>'
    + paths.map((d, i) => '<path d="'+d+'" fill="none" stroke="var(--sand)" stroke-width="'+(i ? 22 : 30)+'" stroke-linejoin="round" clip-path="url(#cl'+(clipN - paths.length + i)+')"/>').join('');
  window.__zflags = zflag('south', 815, 762, '南部') + zflag('mid', 922, 571, '中部') + zflag('far', 903, 378, '偏遠') + zflag('long', 1181, 403, '長途') + zflag('long', 618, 450, '長途');

  LAKES.forEach(l => {
    s += '<g transform="rotate('+l.rot+' '+l.x+' '+l.y+')"><ellipse class="c-lake" cx="'+l.x+'" cy="'+l.y+'" rx="'+l.rx+'" ry="'+l.ry+'"/><ellipse cx="'+(l.x-l.rx*0.3)+'" cy="'+(l.y-l.ry*0.35)+'" rx="'+(l.rx*0.3)+'" ry="'+(l.ry*0.14)+'" fill="#fff" opacity=".35"/></g>';
  });
  TERR.forEach(t => { s += terrace(t[0], t[1], t[2]); });

  const clear = (x, y, k) => !PLACES.some(p => Math.hypot(x-p.x, y-(p.y-30)) < k)
    && !LAKES.some(l => Math.hypot(x-l.x, y-l.y) < 75)
    && !TERR.some(t => Math.abs(x-t[0]) < 70 && y > t[1]-30 && y < t[1]+60)
    && !REGIONS.some(r => Math.abs(x-r.x) < 90 && Math.abs(y-(r.y-8)) < 26);
  const onLand = (x, y) => inPoly(x, y, ISLAND) && edgeDist(x, y, ISLAND) > 34;
  const trees = [];
  for(let n=0; n<4000 && trees.length<52; n++){
    const x = 80+rand()*1230, y = 150+rand()*740;
    if(onLand(x, y) && clear(x, y, 60) && !trees.some(t => Math.hypot(t[0]-x, t[1]-y) < 52)) trees.push([x, y, 0.85+rand()*0.35, (rand()-.5)*14]);
  }
  const flowers = [], fc = ['#FF9EB5','#FFFFFF','#FFE27A'];
  for(let n=0; n<4000 && flowers.length<80; n++){
    const x = 80+rand()*1230, y = 150+rand()*740;
    if(onLand(x, y) && clear(x, y, 46) && !trees.some(t => Math.hypot(t[0]-x, t[1]-y) < 28)) flowers.push([x, y, fc[Math.floor(rand()*3)]]);
  }
  flowers.forEach(f => { s += '<g transform="translate('+f1(f[0])+' '+f1(f[1])+')"><circle r="3.2" fill="'+f[2]+'"/><circle r="1.1" fill="#FFC93C"/></g>'; });
  trees.sort((a,b) => a[1]-b[1]).forEach(t => { s += palm(f1(t[0]), f1(t[1]), f1(t[2]), f1(t[3])); });
  s += palm(1050, 832, 0.85, 6) + palm(984, 774, 0.7, -4);

  s += cloud(200, 150, -20, 1.2) + cloud(560, 180, -100, 1.5) + cloud(900, 130, -60, 1);
  s += '<g transform="translate(960 940)"><g class="boat"><path d="M-22 0 H22 L15 10 H-15Z" fill="var(--act)"/><path d="M0 -4 V-38" stroke="var(--ink)" stroke-width="2.4"/><path d="M2 -36 L24 -6 H2Z" fill="#fff"/><path d="M-2 -30 L-17 -6 H-2Z" fill="var(--club)"/></g></g>';

  const ZONES = [
    {zh:'烏布', c:'#2FA36B', side:'top', max:80}, {zh:'庫塔', c:'#E8643C', side:'left'}, {zh:'金巴蘭', c:'#2F8FD8', side:'left'},
    {zh:'努沙杜瓦', c:'#D99A0B', side:'right'}, {zh:'烏魯瓦圖', c:'#8E5BD6', side:'left'}, {zh:'彰古', c:'#D8559A', side:'left', dy:-26},
    {zh:'水明漾', c:'#17A2A2', side:'left', dy:4}, {zh:'沙努爾', c:'#7A8F1E', side:'bottom'}
  ];
  s += '<g id="zflags">'+window.__zflags+'</g>';
  const zoneSet = new Set(ZONES.map(z => z.zh));
  const med = a => { const t = a.slice().sort((m, n) => m-n); return t[Math.floor(t.length/2)]; };
  let zs = '';
  ZONES.forEach(z => {
    const ps = PLACES.filter(p => p.region === z.zh); if(!ps.length) return;
    const cx = med(ps.map(p => p.x)), cy = med(ps.map(p => p.y));
    const ds = ps.map(p => Math.hypot(p.x-cx, p.y-cy)).sort((m, n) => m-n);
    const r = Math.min(z.max || 56, Math.max(34, ds[Math.floor(ds.length*.75)] * 1.2 + 18));
    const en = (REGIONS.find(q => q.zh === z.zh) || ps[0]).en || ps[0].regionEn;
    const lx = z.side === 'left' ? cx - r - 8 : z.side === 'right' ? cx + r + 8 : cx;
    const ly = (z.side === 'top' ? cy - r - 8 : z.side === 'bottom' ? cy + r + 26 : cy + 8) + (z.dy || 0);
    const anc = z.side === 'left' ? 'end' : z.side === 'right' ? 'start' : 'middle';
    zs += '<g class="zone-g"><circle class="zone-fill" cx="'+f1(cx)+'" cy="'+f1(cy)+'" r="'+f1(r)+'" fill="'+z.c+'"/>'
      + '<circle class="zone-line" cx="'+f1(cx)+'" cy="'+f1(cy)+'" r="'+f1(r)+'" stroke="'+z.c+'"/>'
      + '<text class="zone-name" x="'+f1(lx)+'" y="'+f1(ly)+'" text-anchor="'+anc+'" fill="'+z.c+'">'+z.zh+'區<tspan class="en" dx="0.4em">'+en+'</tspan></text></g>';
  });
  s += '<g id="zones">'+zs+'</g>';
  s += REGIONS.filter(r => !zoneSet.has(r.zh)).map(r => '<text class="region" x="'+r.x+'" y="'+r.y+'" text-anchor="'+r.a+'">'+r.zh
    + (r.stack ? '<tspan class="en" x="'+r.x+'" dy="1.3em">'+r.en+'</tspan>' : '<tspan class="en" dx="0.45em">'+r.en+'</tspan>')
    + '</text>').join('');

  s += '<g id="pins"></g><g id="fx"></g><g id="tipLayer"></g>';
  svg.innerHTML = s;
}

/* ===== 縮放與拖曳 ===== */
const BW = 1400, BH = 900, CY = 530, MAXZ = 20;
let box = {w:1400, h:900};
let view = {cx:700, cy:530, w:1400};
let anim = 0, rafApply = 0, lastU = -1;

const fitW = () => Math.max(isMob() ? 1300 : BW, BH * box.w / box.h);   // 手機：一開始就讓島填滿畫面寬度
const viewH = w => w * box.h / box.w;
function clampView(v){
  const fw = fitW();
  const w = Math.min(fw, Math.max(fw / MAXZ, v.w)), h = viewH(w);
  const cx = w >= BW ? 700 : Math.min(BW - w/2, Math.max(w/2, v.cx));
  const slack = isMob() ? h*0.3 : 0;   // 手機：多留一點空間，讓選到的點能移到面板上方
  const cy = h >= BH ? Math.min(CY + slack, Math.max(CY - slack, v.cy)) : Math.min(980 - h/2 + slack, Math.max(80 + h/2 - slack, v.cy));
  return {cx, cy, w};
}
function metrics(){
  const f = Math.max(.72, Math.min(1, box.w / 1400));
  return {f, ppu: box.w / view.w, u: (view.w / box.w) * f};
}
function applyView(){
  const h = viewH(view.w);
  svg.setAttribute('viewBox', f1(view.cx - view.w/2)+' '+f1(view.cy - h/2)+' '+f1(view.w)+' '+f1(h));
  const m = metrics();
  svg.style.setProperty('--u', m.u.toFixed(4));
  if(Math.abs(m.u - lastU) > lastU * 0.002 || lastU < 0){ lastU = m.u; renderPins(); update(); }
}
function requestApply(){ if(!rafApply) rafApply = requestAnimationFrame(() => { rafApply = 0; applyView(); }); }
function zoomAt(clientX, clientY, k){
  const r = svg.getBoundingClientRect();
  const fx = (clientX - r.left) / r.width, fy = (clientY - r.top) / r.height;
  const h = viewH(view.w);
  const sx = view.cx - view.w/2 + fx*view.w, sy = view.cy - h/2 + fy*h;
  const w2 = Math.min(fitW(), Math.max(fitW()/MAXZ, view.w / k)), h2 = viewH(w2);
  view = clampView({cx: sx - (fx-0.5)*w2, cy: sy - (fy-0.5)*h2, w: w2});
  requestApply();
}
function panBy(dx, dy){
  const ppu = box.w / view.w;
  view = clampView({cx: view.cx - dx/ppu, cy: view.cy - dy/ppu, w: view.w});
  requestApply();
}
function flyTo(cx, cy, w){
  cancelAnimationFrame(anim);
  const target = clampView({cx, cy, w});
  if(reduceMotion()){ view = target; applyView(); return; }
  const start = {...view}, t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / 450), e = 1 - Math.pow(1 - k, 3);
    view = {cx: start.cx + (target.cx-start.cx)*e, cy: start.cy + (target.cy-start.cy)*e, w: start.w * Math.pow(target.w/start.w, e)};
    applyView();
    if(k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}
function fitToPlaces(list){
  if(!list.length) return;
  if(list.length === 1){ flyTo(list[0].x, list[0].y - 30, Math.min(view.w, fitW()/3)); return; }
  const xs = list.map(p => p.x), ys = list.map(p => p.y);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const w = Math.max((x1-x0)*1.6, (y1-y0+80)*1.6*box.w/box.h, 320);
  flyTo((x0+x1)/2, (y0+y1)/2 - 30, w);
}
function measure(){
  const wasFit = view.w >= fitW() - 0.5;
  const r = svg.getBoundingClientRect();
  if(r.width < 10 || r.height < 10) return;
  box = {w:r.width, h:r.height};
  if(wasFit) view.w = fitW();
  view = clampView(view);
  lastU = -1;
  applyView();
}

const ptrs = new Map();
let drag = null, pinch = null, dragMoved = false;
svg.addEventListener('wheel', e => {
  e.preventDefault(); cancelAnimationFrame(anim);
  zoomAt(e.clientX, e.clientY, Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)));
}, {passive:false});
svg.addEventListener('pointerdown', e => {
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  cancelAnimationFrame(anim);
  dragMoved = false;
  if(editMode){
    const pe = e.target.closest('.pin');
    if(pe){
      pinDrag = {id:pe.dataset.id, pid:e.pointerId, moved:false, sx:e.clientX, sy:e.clientY};
      try{ svg.setPointerCapture(e.pointerId); }catch(err){}
      e.preventDefault();
      return;
    }
  }
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size === 2){
    const [a, b] = [...ptrs.values()];
    pinch = {d: Math.hypot(a.x-b.x, a.y-b.y), mx: (a.x+b.x)/2, my: (a.y+b.y)/2};
    drag = null;
  } else drag = {id:e.pointerId, x:e.clientX, y:e.clientY, captured:false};
});
svg.addEventListener('pointermove', e => {
  if(pinDrag && e.pointerId === pinDrag.pid){
    if(!pinDrag.moved && Math.hypot(e.clientX-pinDrag.sx, e.clientY-pinDrag.sy) < 4) return;
    pinDrag.moved = true; dragMoved = true;
    const r = svg.getBoundingClientRect(), h = viewH(view.w), p = byId[pinDrag.id];
    p.x = Math.round(view.cx - view.w/2 + (e.clientX - r.left) / r.width * view.w);
    p.y = Math.round(view.cy - h/2 + (e.clientY - r.top) / r.height * h);
    const el = document.querySelector('.pin[data-id="'+p.id+'"]');
    if(el) el.setAttribute('transform', 'translate('+p.x+' '+p.y+') scale('+(.92 * metrics().u).toFixed(3)+')');
    renderTip(p);
    return;
  }
  if(!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(ptrs.size === 2 && pinch){
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x-b.x, a.y-b.y), mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
    if(pinch.d > 0) zoomAt(mx, my, d / pinch.d);
    panBy(mx - pinch.mx, my - pinch.my);
    pinch = {d, mx, my}; dragMoved = true; return;
  }
  if(drag && drag.id === e.pointerId){
    if(!drag.captured && Math.hypot(e.clientX-drag.x, e.clientY-drag.y) > 5){
      drag.captured = true; dragMoved = true;
      try{ svg.setPointerCapture(e.pointerId); }catch(err){}
      svg.classList.add('dragging');
    }
    if(drag.captured) panBy(e.clientX - prev.x, e.clientY - prev.y);
  }
});
['pointerup', 'pointercancel'].forEach(t => svg.addEventListener(t, e => {
  if(pinDrag && e.pointerId === pinDrag.pid){
    const p = byId[pinDrag.id];
    if(pinDrag.moved){ p.moved = true; savePositions(); updateEditBar(); }
    pinDrag = null; renderPins(); update(); return;
  }
  ptrs.delete(e.pointerId);
  if(ptrs.size < 2) pinch = null;
  if(drag && drag.id === e.pointerId){ drag = null; svg.classList.remove('dragging'); }
}));
const centerClient = () => { const r = svg.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };
$('#zin').addEventListener('click', () => { const c = centerClient(); zoomAt(c[0], c[1], 1.6); });
$('#zout').addEventListener('click', () => { const c = centerClient(); zoomAt(c[0], c[1], 1/1.6); });
$('#zfit').addEventListener('click', () => flyTo(700, CY, fitW()));

/* ===== 篩選狀態 ===== */
let listOpen = false;
let pinned = null, hover = null, query = '', regionSel = '', editMode = false, pinDrag = null;
const sel = new Set(GROUPS.map(g => g.key));
const SUBS = [...new Set(PLACES.map(p => p.sub).filter(Boolean))];
const subSel = new Set(SUBS);
function matches(p){
  if(!sel.has(p.type)) return false;
  if(p.sub && !subSel.has(p.sub)) return false;
  if(regionSel && p.region !== regionSel) return false;
  if(zoneOff.has(p.zone)) return false;
  if(query){
    const t = (p.name+' '+p.short+' '+p.region+' '+p.regionEn+' '+p.cat+' '+p.sub+' '+p.desc+' '+p.place).toLowerCase();
    if(!t.includes(query)) return false;
  }
  return true;
}
const visible = matches;

function buildFilters(){
  const keys = GROUPS.filter(g => PLACES.some(p => p.type === g.key) || ALWAYS.includes(g.key));
  $('#cats').innerHTML = '<legend class="sr">地點類型（可複選）</legend>' + keys.map(g => {
